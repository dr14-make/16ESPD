<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="700" height="330">
  <style>
    text { font-family: sans-serif; fill: #16202c; }
    .box { fill: #fff; stroke: #16202c; stroke-width: 2; }
    .box-accent { fill: #eaf1fa; stroke: #1f5fa8; stroke-width: 2; }
    .arrow { stroke: #16202c; stroke-width: 3; fill: none; }
    .arrow-dash { stroke: #a75d00; stroke-width: 3; fill: none; stroke-dasharray: 8 6; }
    .f-lbl { font-size: 15px; font-weight: 600; fill: #16202c; }
    .f-lbl-warn { font-size: 15px; font-weight: 600; fill: #a75d00; }
    .lbl { font-size: 14px; fill: #4a5a6b; }
  </style>
  <defs>
    <marker id="etc-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#16202c"/></marker>
    <marker id="etc-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a75d00"/></marker>
  </defs>
  <!-- forward path -->
  <rect class="box" x="10" y="40" width="80" height="56" rx="4"/>
  <text x="50" y="74" text-anchor="middle" font-size="17">pedal</text>
  <path class="arrow" d="M90 68 H128" marker-end="url(#etc-ink)"/>
  <circle cx="140" cy="68" r="11" fill="#fff" stroke="#16202c" stroke-width="2"/>
  <text x="96" y="58" class="f-lbl">u_cmd</text>
  <text x="128" y="96" class="lbl">−</text>
  <path class="arrow" d="M151 68 H184" marker-end="url(#etc-ink)"/>
  <rect class="box-accent" x="190" y="40" width="90" height="56" rx="4"/>
  <text x="235" y="74" text-anchor="middle" font-size="17">PID</text>
  <path class="arrow" d="M280 68 H314" marker-end="url(#etc-ink)"/>
  <text x="286" y="58" class="f-lbl">V</text>
  <rect class="box" x="320" y="40" width="100" height="56" rx="4"/>
  <text x="370" y="64" text-anchor="middle" font-size="16">H-bridge</text>
  <text x="370" y="84" text-anchor="middle" class="lbl">± U_batt</text>
  <path class="arrow" d="M420 68 H454" marker-end="url(#etc-ink)"/>
  <text x="424" y="58" class="f-lbl">i</text>
  <rect class="box" x="460" y="40" width="100" height="56" rx="4"/>
  <text x="510" y="64" text-anchor="middle" font-size="16">DC motor</text>
  <text x="510" y="84" text-anchor="middle" class="lbl">R, L, k</text>
  <path class="arrow" d="M560 68 H594" marker-end="url(#etc-ink)"/>
  <rect class="box" x="600" y="40" width="90" height="56" rx="4"/>
  <text x="645" y="74" text-anchor="middle" font-size="16">gearbox</text>
  <path class="arrow" d="M645 96 V134" marker-end="url(#etc-ink)"/>
  <!-- plate and what acts on it -->
  <rect class="box-accent" x="560" y="140" width="130" height="64" rx="4"/>
  <text x="625" y="168" text-anchor="middle" font-size="16">plate inertia</text>
  <text x="625" y="190" text-anchor="middle" class="lbl">stops, friction</text>
  <rect class="box" x="360" y="140" width="150" height="64" rx="4"/>
  <text x="435" y="166" text-anchor="middle" font-size="16">return spring</text>
  <text x="435" y="188" text-anchor="middle" class="lbl">limp home at 6°</text>
  <path class="arrow-dash" d="M510 172 H554" marker-end="url(#etc-warn)"/>
  <text x="514" y="164" class="f-lbl-warn">τ</text>
  <path class="arrow" d="M625 204 V240" marker-end="url(#etc-ink)"/>
  <text x="635" y="228" class="f-lbl">φ</text>
  <!-- feedback through the sensor -->
  <rect class="box" x="510" y="246" width="180" height="56" rx="4"/>
  <text x="600" y="270" text-anchor="middle" font-size="16">TPS, two tracks</text>
  <text x="600" y="290" text-anchor="middle" class="lbl">V1 rises, V2 falls</text>
  <path class="arrow" d="M510 274 H346" marker-end="url(#etc-ink)"/>
  <text x="400" y="264" class="f-lbl">V1, V2</text>
  <rect class="box-accent" x="180" y="246" width="160" height="56" rx="4"/>
  <text x="260" y="270" text-anchor="middle" font-size="16">ECU estimate</text>
  <text x="260" y="290" text-anchor="middle" class="lbl">½ + (V1 − V2) / 8 V</text>
  <path class="arrow" d="M180 274 H140 V85" marker-end="url(#etc-ink)"/>
  <text x="70" y="200" class="f-lbl">u_meas</text>
</svg>
