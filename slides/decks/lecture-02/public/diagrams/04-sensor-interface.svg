<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 345" width="700" height="345">
  <style>
    text { font-family: sans-serif; fill: #16202c; }
    .wire { stroke: #16202c; stroke-width: 2.5; fill: none; }
    .thin { stroke: #4a5a6b; stroke-width: 1.5; fill: none; }
    .box { fill: #fff; stroke: #16202c; stroke-width: 2.5; }
    .fill { fill: #eaf1fa; stroke: #1f5fa8; stroke-width: 2.5; }
    .acc { stroke: #1f5fa8; stroke-width: 3; fill: none; }
    .warnline { stroke: #a75d00; stroke-width: 3; fill: none; }
    .lbl { font-size: 18px; fill: #4a5a6b; }
    .sm { font-size: 15px; fill: #4a5a6b; }
    .out { font-size: 20px; font-weight: 600; }
    .head { font-size: 21px; font-weight: 600; }
    .warn { font-size: 18px; font-weight: 600; fill: #a75d00; }
    .accent { font-size: 18px; font-weight: 600; fill: #1f5fa8; }
  </style>
  <defs>

  </defs>
  <rect x="230" y="30" width="200" height="250" fill="none" stroke="#4a5a6b" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="330" y="22" class="lbl" text-anchor="middle">ECU</text>
  <rect class="fill" x="270" y="50" width="120" height="44"/>
  <text x="330" y="78" class="out" text-anchor="middle">5 V ref</text>
  <rect class="fill" x="290" y="170" width="100" height="56"/>
  <text x="340" y="196" class="out" text-anchor="middle">ADC</text>
  <text x="340" y="216" class="sm" text-anchor="middle">same reference</text>
  <path class="acc" d="M370 94 V170"/>
  <rect class="box" x="30" y="110" width="120" height="110"/>
  <text x="90" y="160" class="out" text-anchor="middle">sensor</text>
  <text x="90" y="182" class="sm" text-anchor="middle">TPS, MAP, rail</text>
  <path class="wire" d="M270 72 H120 V110"/>
  <text x="160" y="64" class="sm">supply</text>
  <path class="wire" d="M150 160 H260 V198 H290"/>
  <text x="160" y="152" class="sm">signal</text>
  <rect x="250" y="222" width="20" height="34" class="box"/>
  <path class="wire" d="M260 198 V222 M260 256 V272"/>
  <text x="242" y="246" class="sm" text-anchor="end">pull-down</text>
  <path class="wire" d="M90 220 V272 M60 272 H290 M70 279 H280"/>
  <text x="160" y="300" class="sm" text-anchor="middle">sensor ground</text>
  <rect x="476" y="255.0" width="34" height="25.0" fill="#f3e3cc" stroke="#4a5a6b" stroke-width="1.5"/>
  <rect x="476" y="55.0" width="34" height="200.0" fill="#eaf1fa" stroke="#4a5a6b" stroke-width="1.5"/>
  <rect x="476" y="30.0" width="34" height="25.0" fill="#f3e3cc" stroke="#4a5a6b" stroke-width="1.5"/>
  <text x="470" y="286.0" class="sm" text-anchor="end">0 V</text>
  <text x="470" y="261.0" class="sm" text-anchor="end">0.5 V</text>
  <text x="470" y="61.0" class="sm" text-anchor="end">4.5 V</text>
  <text x="470" y="36.0" class="sm" text-anchor="end">5 V</text>
  <text x="518" y="151.0" class="accent">valid span</text>
  <text x="518" y="171.0" class="sm">the measurement</text>
  <text x="518" y="261.5" class="warn">fault</text>
  <text x="518" y="279.5" class="sm">short to ground, open wire</text>
  <text x="518" y="40.5" class="warn">fault</text>
  <text x="518" y="58.5" class="sm">short to supply</text>
  <text x="493" y="20" class="lbl" text-anchor="middle">signal</text>
  <text x="350" y="330" class="lbl" text-anchor="middle">ratiometric: the ADC reads V / V_ref, so a drifting reference cancels</text>
</svg>
