<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 372" width="620" height="372">
  <style>
    text { font-family: sans-serif; fill: #16202c; }
    .wire { stroke: #16202c; stroke-width: 2.5; fill: none; }
    .res { fill: #fff; stroke: #16202c; stroke-width: 2.5; }
    .track { fill: #eaf1fa; stroke: #1f5fa8; stroke-width: 2.5; }
    .wiper { stroke: #1f5fa8; stroke-width: 3; fill: none; }
    .shaft { stroke: #a75d00; stroke-width: 3; fill: none; stroke-dasharray: 8 6; }
    .lbl { font-size: 20px; fill: #4a5a6b; }
    .out { font-size: 24px; font-weight: 600; }
    .warn { font-size: 20px; font-weight: 600; fill: #a75d00; }
  </style>
  <defs>
    <marker id="tp-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1f5fa8"/></marker>
  </defs>
  <!-- supply and ground rails -->
  <path class="wire" d="M80 40 H560"/>
  <text x="10" y="48" class="out">5 V</text>
  <path class="wire" d="M80 320 H560"/>
  <path class="wire" d="M80 320 V326 M70 326 H90 M74 333 H86 M78 340 H82"/>
  <text x="10" y="327" class="lbl">0 V</text>
  <!-- track 1: rises with the angle -->
  <path class="wire" d="M150 40 V62"/>
  <rect class="res" x="138" y="62" width="24" height="34"/>
  <text x="172" y="84" class="lbl">R_end</text>
  <path class="wire" d="M150 96 V110"/>
  <rect class="track" x="134" y="110" width="32" height="140"/>
  <text x="104" y="185" class="lbl" text-anchor="end">track 1</text>
  <path class="wire" d="M150 250 V264"/>
  <rect class="res" x="138" y="264" width="24" height="34"/>
  <text x="172" y="286" class="lbl">R_end</text>
  <path class="wire" d="M150 298 V320"/>
  <path class="wiper" d="M222 170 H172" marker-end="url(#tp-ar)"/>
  <path class="wire" d="M222 170 H262"/>
  <text x="270" y="176" class="out">V1</text>
  <!-- track 2: wired the other way, falls with the angle -->
  <path class="wire" d="M430 40 V62"/>
  <rect class="res" x="418" y="62" width="24" height="34"/>
  <text x="452" y="84" class="lbl">R_end</text>
  <path class="wire" d="M430 96 V110"/>
  <rect class="track" x="414" y="110" width="32" height="140"/>
  <text x="384" y="185" class="lbl" text-anchor="end">track 2</text>
  <path class="wire" d="M430 250 V264"/>
  <rect class="res" x="418" y="264" width="24" height="34"/>
  <text x="452" y="286" class="lbl">R_end</text>
  <path class="wire" d="M430 298 V320"/>
  <path class="wiper" d="M502 210 H452" marker-end="url(#tp-ar)"/>
  <path class="wire" d="M502 210 H542"/>
  <text x="550" y="216" class="out">V2</text>
  <!-- one shaft moves both wipers in opposite directions along their tracks -->
  <path class="shaft" d="M222 170 V138 H502 V210"/>
  <text x="300" y="128" class="warn" text-anchor="middle">shaft, angle φ</text>
  <!-- direction each wiper travels as the plate opens -->
  <path class="wiper" d="M196 230 V196" marker-end="url(#tp-ar)"/>
  <text x="204" y="236" class="lbl">opens</text>
  <path class="wiper" d="M476 222 V252" marker-end="url(#tp-ar)"/>
  <text x="484" y="246" class="lbl">opens</text>
  <text x="320" y="364" class="lbl" text-anchor="middle">V1 + V2 = 5 V at every angle: the ECU's plausibility check</text>
</svg>
