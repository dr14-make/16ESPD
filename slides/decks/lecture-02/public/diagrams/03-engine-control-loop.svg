<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" width="560" height="330">
  <style>
    text { font-family: sans-serif; fill: #16202c; }
    .box { fill: #fff; stroke: #16202c; stroke-width: 2; }
    .box-accent { fill: #eaf1fa; stroke: #1f5fa8; stroke-width: 2; }
    .lbl { font-size: 14px; fill: #4a5a6b; }
    .arrow { stroke: #16202c; stroke-width: 3; fill: none; }
    .arrow-dash { stroke: #a75d00; stroke-width: 3; fill: none; stroke-dasharray: 8 6; }
    .f-lbl { font-size: 16px; font-weight: 600; fill: #16202c; }
    .f-lbl-warn { font-size: 16px; font-weight: 600; fill: #a75d00; }
  </style>
  <defs>
    <marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#16202c"/></marker>
    <marker id="ar-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a75d00"/></marker>
  </defs>
  <rect class="box" x="150" y="10" width="260" height="44" rx="4"/>
  <text x="280" y="38" text-anchor="middle" font-size="16">other vehicle systems' control</text>
  <path class="arrow" d="M280 60 V100" marker-start="url(#ar-ink)" marker-end="url(#ar-ink)"/>
  <rect class="box-accent" x="220" y="106" width="120" height="56" rx="4"/>
  <text x="280" y="141" text-anchor="middle" font-size="20" font-weight="600">ECU</text>
  <rect class="box" x="20" y="106" width="130" height="56" rx="4"/>
  <text x="85" y="141" text-anchor="middle" font-size="18">sensors</text>
  <rect class="box" x="410" y="106" width="130" height="56" rx="4"/>
  <text x="475" y="141" text-anchor="middle" font-size="18">actuators</text>
  <path class="arrow" d="M150 134 H214" marker-end="url(#ar-ink)"/>
  <path class="arrow" d="M340 134 H404" marker-end="url(#ar-ink)"/>
  <rect class="box-accent" x="200" y="236" width="160" height="60" rx="30"/>
  <text x="280" y="272" text-anchor="middle" font-size="20" font-weight="600">engine</text>
  <path class="arrow" d="M475 162 V266 H366" marker-end="url(#ar-ink)"/>
  <path class="arrow" d="M200 266 H85 V168" marker-end="url(#ar-ink)"/>
  <text class="lbl" x="372" y="290">injection, ignition, throttle</text>
  <text class="lbl" x="20" y="290">speed, air, temperature, λ</text>
</svg>
