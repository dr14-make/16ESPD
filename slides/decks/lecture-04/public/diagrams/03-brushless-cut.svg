    .torque { stroke: #16202c; stroke-width: 2.5; fill: none; }
    .heat { stroke: #d9480f; stroke-width: 2; fill: none; stroke-linecap: round; }
    .chip { fill: #16202c; }
    .inv { fill: #eaf1fa; stroke: #1f5fa8; stroke-width: 2; }
    .cool { fill: #cfe6f3; stroke: #1f5fa8; stroke-width: 1; }
    .title { font-size: 21px; font-weight: 700; }
    .t { font-size: 24px; font-weight: 700; }
    .sig { font-size: 15px; font-weight: 600; }
    .lbl { font-size: 14px; fill: #4a5a6b; }
    .small { font-size: 12px; fill: #4a5a6b; }
    .ph { font-size: 14px; font-weight: 700; fill: #a75d00; }
    .hot { font-size: 14px; font-weight: 600; fill: #d9480f; }
    .rub { font-size: 14px; font-weight: 600; fill: #c0392b; }
    .ok { font-size: 14px; font-weight: 600; fill: #2e8b57; }
    .halo { paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }
  </style>
