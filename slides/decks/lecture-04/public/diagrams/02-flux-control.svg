  <text x="500" y="326" text-anchor="middle" class="sig">Φ ∝ i<tspan baseline-shift="sub" font-size="12">f</tspan>, from a source of its own</text>
  <text x="500" y="348" text-anchor="middle" class="lbl">turn i<tspan baseline-shift="sub" font-size="12">f</tspan> down: faster on the same voltage</text>
</svg>
