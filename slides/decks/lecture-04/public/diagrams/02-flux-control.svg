<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 372" width="760" height="372">
  <style>
    text { font-family: sans-serif; fill: #16202c; }
    .house { fill: #e3e7ec; stroke: #4a5a6b; stroke-width: 2; }
    .iron { fill: #f1f3f5; stroke: #16202c; stroke-width: 2; }
    .pole { fill: #e3e7ec; stroke: #4a5a6b; stroke-width: 2; }
    .shaft { fill: #c9ced6; stroke: #16202c; stroke-width: 2; }
    .north { fill: #f6d5d3; stroke: #c0392b; stroke-width: 2; }
    .south { fill: #dbe7f6; stroke: #1f5fa8; stroke-width: 2; }
    .slot { fill: #fdf0e0; stroke: #a75d00; stroke-width: 1.5; }
    .mark { stroke: #16202c; stroke-width: 2; }
    .field { stroke: #4a5a6b; stroke-width: 1.5; stroke-dasharray: 6 5; fill: none; }
    .wire { stroke: #a75d00; stroke-width: 2; fill: none; }
    .src { fill: #fff; stroke: #a75d00; stroke-width: 2; }
    .knob { stroke: #a75d00; stroke-width: 1.5; fill: none; }
    .title { font-size: 20px; font-weight: 700; }
    .t { font-size: 22px; font-weight: 700; }
    .red { fill: #c0392b; }
    .blue { fill: #1f5fa8; }
    .orange { fill: #a75d00; }
    .sig { font-size: 16px; font-weight: 600; }
    .lbl { font-size: 15px; fill: #4a5a6b; }
  </style>
  <defs>
    <marker id="fc-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4a5a6b"/></marker>
    <marker id="fc-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a75d00"/></marker>
    <marker id="fc-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a75d00"/></marker>
  </defs>
