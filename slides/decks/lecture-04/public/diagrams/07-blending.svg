<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360">
  <style>
    text { font-family: sans-serif; fill: #16202c; }
    .axis { stroke: #16202c; stroke-width: 2; fill: none; }
    .regen { fill: #cfe3d6; stroke: #2e8b57; stroke-width: 2; }
    .friction { fill: #f6d5d3; stroke: #c0392b; stroke-width: 2; }
    .limit { stroke: #4a5a6b; stroke-width: 1.5; stroke-dasharray: 6 4; fill: none; }
    .t { font-size: 18px; font-weight: 600; }
    .lbl { font-size: 14px; fill: #4a5a6b; }
    .g { font-size: 15px; font-weight: 600; fill: #2e8b57; }
    .r { font-size: 15px; font-weight: 600; fill: #c0392b; }
  </style>
  <defs>
    <marker id="bl-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#16202c"/></marker>
  </defs>

  <text x="250" y="28" text-anchor="middle" class="t">series: the machine first</text>
  <path class="axis" d="M60 300 H450" marker-end="url(#bl-ink)"/>
  <path class="axis" d="M60 300 V50" marker-end="url(#bl-ink)"/>
  <path class="regen" d="M60 300 L240 120 L420 120 L420 300 Z"/>
  <path class="friction" d="M240 120 L420 -60 L420 120 Z" clip-path="url(#bl-clip-a)"/>
  <clipPath id="bl-clip-a"><rect x="60" y="50" width="390" height="250"/></clipPath>
  <path class="limit" d="M60 120 H440"/>
  <text x="70" y="112" class="lbl">machine limit</text>
  <text x="330" y="230" text-anchor="middle" class="g">regen</text>
  <text x="380" y="100" text-anchor="middle" class="r">friction</text>
  <text x="255" y="330" text-anchor="middle" class="lbl">driver's brake demand →</text>
  <text x="40" y="180" text-anchor="middle" class="lbl" transform="rotate(-90 40 180)">braking torque →</text>

  <text x="750" y="28" text-anchor="middle" class="t">parallel: a fixed share</text>
  <path class="axis" d="M560 300 H950" marker-end="url(#bl-ink)"/>
  <path class="axis" d="M560 300 V50" marker-end="url(#bl-ink)"/>
  <path class="regen" d="M560 300 L920 210 L920 300 Z"/>
  <path class="friction" d="M560 300 L920 60 L920 210 Z"/>
  <path class="limit" d="M560 120 H940"/>
  <text x="570" y="112" class="lbl">machine limit</text>
  <text x="860" y="270" text-anchor="middle" class="g">regen</text>
  <text x="860" y="170" text-anchor="middle" class="r">friction</text>
  <text x="755" y="330" text-anchor="middle" class="lbl">driver's brake demand →</text>
  <text x="540" y="180" text-anchor="middle" class="lbl" transform="rotate(-90 540 180)">braking torque →</text>
</svg>
