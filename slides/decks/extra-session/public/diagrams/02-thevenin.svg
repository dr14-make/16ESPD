<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 320" width="580" height="320">
  <style>
    text { font-family: sans-serif; fill: #16202c; }
    .wire { stroke: #16202c; stroke-width: 2.5; fill: none; }
    .res { fill: #fff; stroke: #16202c; stroke-width: 2.5; }
    .src { fill: #eaf1fa; stroke: #1f5fa8; stroke-width: 2.5; }
    .cur { stroke: #a75d00; stroke-width: 2.5; fill: none; }
    .t { font-size: 18px; font-weight: 600; }
    .pm { font-size: 20px; font-weight: 600; }
    .lbl { font-size: 15px; fill: #4a5a6b; }
    .orange { font-size: 18px; font-weight: 600; fill: #a75d00; }
  </style>
  <defs>
    <marker id="th-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a75d00"/></marker>
  </defs>

  <path class="wire" d="M130 110 V170 M130 230 V290 H520"/>
  <circle class="src" cx="130" cy="200" r="30"/>
  <text x="130" y="192" text-anchor="middle" class="pm">+</text>
  <text x="130" y="220" text-anchor="middle" class="pm">−</text>
  <text x="88" y="196" text-anchor="end" class="t">OCV</text>
  <text x="88" y="217" text-anchor="end" class="lbl">(SoC)</text>

  <path class="wire" d="M130 110 H180 M240 110 H300 M420 110 H520"/>
  <rect class="res" x="180" y="99" width="60" height="22"/>
  <text x="210" y="88" text-anchor="middle" class="t">R₀</text>

  <circle cx="300" cy="110" r="4.5" fill="#16202c"/>
  <circle cx="420" cy="110" r="4.5" fill="#16202c"/>
  <path class="wire" d="M300 110 V60 H330 M390 60 H420 V110"/>
  <rect class="res" x="330" y="49" width="60" height="22"/>
  <text x="360" y="38" text-anchor="middle" class="t">R₁</text>
  <path class="wire" d="M300 110 V160 H353 M367 160 H420 V110"/>
  <path class="wire" d="M353 142 V178 M367 142 V178" style="stroke-width: 3.5"/>
  <text x="380" y="198" class="t">C₁</text>
  <text x="300" y="232" text-anchor="middle" class="pm">+</text>
  <text x="360" y="232" text-anchor="middle" class="t">v₁</text>
  <text x="420" y="232" text-anchor="middle" class="pm">−</text>

  <path class="cur" d="M445 94 H492" marker-end="url(#th-orange)"/>
  <text x="468" y="84" text-anchor="middle" class="orange">i</text>

  <circle cx="520" cy="110" r="6" fill="#fff" stroke="#16202c" stroke-width="2.5"/>
  <circle cx="520" cy="290" r="6" fill="#fff" stroke="#16202c" stroke-width="2.5"/>
  <text x="545" y="117" text-anchor="middle" class="pm">+</text>
  <text x="545" y="207" text-anchor="middle" class="t">v</text>
  <text x="545" y="297" text-anchor="middle" class="pm">−</text>
</svg>
