<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 340" width="1240" height="340">
  <style>
    text { font-family: sans-serif; fill: #16202c; }
    .src { fill: #fff; stroke: #16202c; stroke-width: 2; }
    .box { fill: #eaf1fa; stroke: #1f5fa8; stroke-width: 2; }
    .car { fill: none; stroke: #4a5a6b; stroke-width: 2; stroke-dasharray: 6 4; }
    .obc { fill: #fdf3e6; stroke: #a75d00; stroke-width: 2; }
    .obc-off { fill: #fff; stroke: #b7c0ca; stroke-width: 2; stroke-dasharray: 4 3; }
    .batt { fill: #cfe3d6; stroke: #2e8b57; stroke-width: 2; }
    .ac { stroke: #a75d00; stroke-width: 3; fill: none; }
    .dcl { stroke: #a75d00; stroke-width: 5; fill: none; }
    .pilot { stroke: #1f5fa8; stroke-width: 2; stroke-dasharray: 5 4; fill: none; }
    .sep { stroke: #c9d1da; stroke-width: 1.5; fill: none; }
    .t { font-size: 18px; font-weight: 600; }
    .b { font-size: 15px; font-weight: 600; }
    .off { fill: #9aa5b1; }
    .lbl { font-size: 14px; fill: #4a5a6b; }
    .sm { font-size: 13px; font-weight: 600; fill: #1f5fa8; }
    .bl { font-size: 13px; fill: #1f5fa8; }
  </style>
  <defs>
    <marker id="cm-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a75d00"/></marker>
    <marker id="cm-orange-dc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3" markerHeight="3" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a75d00"/></marker>
  </defs>
  <path class="sep" d="M314 20 V330 M622 20 V330 M930 20 V330"/>

  <!-- Mode 1 -->
  <text x="160" y="30" text-anchor="middle" class="t">Mode 1</text>
  <text x="160" y="52" text-anchor="middle" class="lbl">AC, household socket</text>
  <rect class="src" x="22" y="120" width="56" height="70" rx="8"/>
  <circle cx="41" cy="155" r="5" fill="#16202c"/>
  <circle cx="59" cy="155" r="5" fill="#16202c"/>
  <text x="50" y="212" text-anchor="middle" class="lbl">socket</text>
  <path class="ac" d="M78 155 H160"/>
  <rect class="car" x="160" y="80" width="146" height="170" rx="10"/>
  <text x="296" y="242" text-anchor="end" class="lbl">car</text>
  <rect class="obc" x="188" y="100" width="64" height="40" rx="4"/>
  <text x="220" y="126" text-anchor="middle" class="b">OBC</text>
  <rect class="batt" x="188" y="178" width="96" height="40" rx="4"/>
  <text x="236" y="204" text-anchor="middle" class="b">battery</text>
  <path class="ac" d="M160 155 H172 V120 H184" marker-end="url(#cm-orange)"/>
  <path class="ac" d="M252 120 H272 V174" marker-end="url(#cm-orange)"/>
  <text x="160" y="290" text-anchor="middle" class="lbl">≤ 16 A, no communication;</text>
  <text x="160" y="310" text-anchor="middle" class="lbl">restricted in many countries</text>

  <!-- Mode 2 -->
  <text x="468" y="30" text-anchor="middle" class="t">Mode 2</text>
  <text x="468" y="52" text-anchor="middle" class="lbl">AC, socket + in-cable box</text>
  <rect class="src" x="330" y="120" width="56" height="70" rx="8"/>
  <circle cx="349" cy="155" r="5" fill="#16202c"/>
  <circle cx="367" cy="155" r="5" fill="#16202c"/>
  <text x="358" y="212" text-anchor="middle" class="lbl">socket</text>
  <path class="ac" d="M386 155 H403 M449 155 H468"/>
  <rect class="box" x="403" y="141" width="46" height="28" rx="4"/>
  <text x="426" y="190" text-anchor="middle" class="sm">IC-CPD</text>
  <rect class="car" x="468" y="80" width="146" height="170" rx="10"/>
  <text x="604" y="242" text-anchor="end" class="lbl">car</text>
  <rect class="obc" x="496" y="100" width="64" height="40" rx="4"/>
  <text x="528" y="126" text-anchor="middle" class="b">OBC</text>
  <rect class="batt" x="496" y="178" width="96" height="40" rx="4"/>
  <text x="544" y="204" text-anchor="middle" class="b">battery</text>
  <path class="ac" d="M468 155 H480 V120 H492" marker-end="url(#cm-orange)"/>
  <path class="ac" d="M560 120 H580 V174" marker-end="url(#cm-orange)"/>
  <text x="468" y="290" text-anchor="middle" class="lbl">≤ 32 A, ≤ 250 V 1-ph</text>
  <text x="468" y="310" text-anchor="middle" class="lbl">or ≤ 480 V 3-ph (IEC 62752)</text>

  <!-- Mode 3 -->
  <text x="776" y="30" text-anchor="middle" class="t">Mode 3</text>
  <text x="776" y="52" text-anchor="middle" class="lbl">AC, wallbox with pilot</text>
  <rect class="src" x="638" y="100" width="56" height="100" rx="6"/>
  <text x="666" y="222" text-anchor="middle" class="lbl">wallbox</text>
  <path class="ac" d="M694 155 H776"/>
  <path class="pilot" d="M694 140 H776"/>
  <text x="735" y="132" text-anchor="middle" class="bl">pilot</text>
  <rect class="car" x="776" y="80" width="146" height="170" rx="10"/>
  <text x="912" y="242" text-anchor="end" class="lbl">car</text>
  <rect class="obc" x="804" y="100" width="64" height="40" rx="4"/>
  <text x="836" y="126" text-anchor="middle" class="b">OBC</text>
  <rect class="batt" x="804" y="178" width="96" height="40" rx="4"/>
  <text x="852" y="204" text-anchor="middle" class="b">battery</text>
  <path class="ac" d="M776 155 H788 V120 H800" marker-end="url(#cm-orange)"/>
  <path class="ac" d="M868 120 H888 V174" marker-end="url(#cm-orange)"/>
  <text x="776" y="290" text-anchor="middle" class="lbl">Type 2 ≤ 63 A 3-ph: 3 × 16 A</text>
  <text x="776" y="310" text-anchor="middle" class="lbl">= 11 kW, 3 × 32 A = 22 kW</text>

  <!-- Mode 4 -->
  <text x="1084" y="30" text-anchor="middle" class="t">Mode 4</text>
  <text x="1084" y="52" text-anchor="middle" class="lbl">DC, charger off board</text>
  <rect class="src" x="946" y="80" width="56" height="140" rx="6"/>
  <text x="974" y="136" text-anchor="middle" class="lbl">AC</text>
  <text x="974" y="156" text-anchor="middle" class="lbl">→</text>
  <text x="974" y="176" text-anchor="middle" class="lbl">DC</text>
  <text x="974" y="242" text-anchor="middle" class="lbl">DC charger</text>
  <path class="dcl" d="M1002 155 H1084"/>
  <path class="pilot" d="M1002 140 H1084"/>
  <text x="1043" y="132" text-anchor="middle" class="bl">pilot</text>
  <rect class="car" x="1084" y="80" width="146" height="170" rx="10"/>
  <text x="1220" y="242" text-anchor="end" class="lbl">car</text>
  <rect class="obc-off" x="1112" y="100" width="64" height="40" rx="4"/>
  <text x="1144" y="126" text-anchor="middle" class="b off">OBC</text>
  <rect class="batt" x="1112" y="178" width="96" height="40" rx="4"/>
  <text x="1160" y="204" text-anchor="middle" class="b">battery</text>
  <path class="dcl" d="M1084 155 H1096 V198 H1108" marker-end="url(#cm-orange-dc)"/>
  <text x="1084" y="290" text-anchor="middle" class="lbl">CCS2, CHAdeMO, GB/T, NACS;</text>
  <text x="1084" y="310" text-anchor="middle" class="lbl">bypasses the on-board charger</text>
</svg>
