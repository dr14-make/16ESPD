<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 270" width="1240" height="270">
  <style>
    text { font-family: sans-serif; fill: #16202c; }
    .box { fill: #eaf1fa; stroke: #1f5fa8; stroke-width: 2; }
    .box-given { fill: #fff; stroke: #4a5a6b; stroke-width: 2; stroke-dasharray: 6 4; }
    .station { fill: none; stroke: #4a5a6b; stroke-width: 1.5; stroke-dasharray: 3 5; }
    .fwd { stroke: #16202c; stroke-width: 3; fill: none; }
    .t { font-size: 18px; font-weight: 600; }
    .lbl { font-size: 16px; fill: #4a5a6b; }
    .v { font-size: 17px; font-weight: 600; }
    .loss { font-size: 17px; font-weight: 600; fill: #a75d00; }
  </style>
  <defs>
    <marker id="sc-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#16202c"/></marker>
  </defs>

  <!-- supply: three ways in -->
  <rect class="box-given" x="10" y="20" width="200" height="56" rx="4"/>
  <text x="110" y="54" text-anchor="middle" class="t">tube trailer</text>
  <rect class="box-given" x="10" y="96" width="200" height="56" rx="4"/>
  <text x="110" y="120" text-anchor="middle" class="t">liquid tanker</text>
  <text x="110" y="141" text-anchor="middle" class="lbl">cryopump, vaporizer</text>
  <rect class="box-given" x="10" y="172" width="200" height="56" rx="4"/>
  <text x="110" y="196" text-anchor="middle" class="t">on site</text>
  <text x="110" y="217" text-anchor="middle" class="lbl">electrolysis or SMR</text>
  <text x="110" y="256" text-anchor="middle" class="lbl">supply</text>
  <path class="fwd" d="M210 48 H232 V200 H210 M210 124 H232"/>
  <path class="fwd" d="M232 124 H266" marker-end="url(#sc-ink)"/>

  <!-- the station -->
  <rect class="station" x="256" y="62" width="824" height="180" rx="8"/>
  <text x="270" y="84" class="lbl">station</text>

  <rect class="box" x="270" y="94" width="130" height="60" rx="4"/>
  <text x="335" y="130" text-anchor="middle" class="t">bulk storage</text>
  <text x="335" y="182" text-anchor="middle" class="lbl">low pressure</text>
  <path class="fwd" d="M400 124 H426" marker-end="url(#sc-ink)"/>

  <rect class="box" x="430" y="94" width="130" height="60" rx="4"/>
  <text x="495" y="130" text-anchor="middle" class="t">compressor</text>
  <text x="495" y="182" text-anchor="middle" class="loss">≈ 3.0 kWh/kg</text>
  <path class="fwd" d="M560 124 H586" marker-end="url(#sc-ink)"/>

  <rect class="box" x="590" y="94" width="170" height="60" rx="4"/>
  <text x="675" y="130" text-anchor="middle" class="t">cascade storage</text>
  <text x="675" y="182" text-anchor="middle" class="v">300–950 bar</text>
  <path class="fwd" d="M760 124 H786" marker-end="url(#sc-ink)"/>

  <rect class="box" x="790" y="94" width="120" height="60" rx="4"/>
  <text x="850" y="130" text-anchor="middle" class="t">chiller</text>
  <text x="850" y="182" text-anchor="middle" class="v">−40 °C</text>
  <text x="850" y="206" text-anchor="middle" class="loss">0.15–0.2 kWh/kg</text>
  <path class="fwd" d="M910 124 H936" marker-end="url(#sc-ink)"/>

  <rect class="box" x="940" y="94" width="130" height="60" rx="4"/>
  <text x="1005" y="130" text-anchor="middle" class="t">dispenser</text>
  <text x="1005" y="182" text-anchor="middle" class="v">H70: ≤ 875 bar</text>
  <text x="1005" y="206" text-anchor="middle" class="lbl">or H35</text>
  <path class="fwd" d="M1070 124 H1096" marker-end="url(#sc-ink)"/>

  <rect class="box-given" x="1100" y="94" width="130" height="60" rx="4"/>
  <text x="1165" y="130" text-anchor="middle" class="t">car</text>
  <text x="1165" y="182" text-anchor="middle" class="v">5.6 kg, 700 bar</text>
  <text x="1165" y="206" text-anchor="middle" class="lbl">tank gas ≤ 85 °C</text>
</svg>
