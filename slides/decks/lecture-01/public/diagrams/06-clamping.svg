<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" width="980" height="330">
  <style>
    text { font-family: sans-serif; fill: #16202c; }
    .box { fill: #fff; stroke: #16202c; stroke-width: 2; }
    .box-accent { fill: #eaf1fa; stroke: #1f5fa8; stroke-width: 2; }
    .wire { stroke: #16202c; stroke-width: 2; fill: none; }
    .wire-soft { stroke: #4a5a6b; stroke-width: 2; fill: none; stroke-dasharray: 5 4; }
    .lbl { font-size: 13px; fill: #4a5a6b; }
    .lbl-strong { font-size: 14px; fill: #16202c; font-weight: 600; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#16202c"/>
    </marker>
  </defs>
  <path class="wire" d="M14 56 H90" marker-end="url(#arrow)"/>
  <text class="lbl-strong" x="16" y="44">e</text>
  <rect class="box" x="90"  y="30" width="140" height="52" rx="4"/>
  <text x="160" y="62" text-anchor="middle" font-size="17">integrator</text>
  <path class="wire" d="M230 56 H290" marker-end="url(#arrow)"/>
  <rect class="box" x="290" y="30" width="100" height="52" rx="4"/>
  <text x="340" y="62" text-anchor="middle" font-size="17">Σ P+I+D</text>
  <path class="wire" d="M390 56 H450" marker-end="url(#arrow)"/>
  <rect class="box-accent" x="450" y="30" width="150" height="52" rx="4"/>
  <text x="525" y="62" text-anchor="middle" font-size="17">saturation</text>
  <path class="wire" d="M600 56 H670" marker-end="url(#arrow)"/>
  <rect class="box" x="670" y="30" width="130" height="52" rx="4"/>
  <text x="735" y="62" text-anchor="middle" font-size="17">actuator</text>
  <path class="wire" d="M800 56 H950"/>
  <text class="lbl-strong" x="905" y="44">u</text>
  <path class="wire-soft" d="M425 56 V140 H480" marker-end="url(#arrow)"/>
  <path class="wire-soft" d="M635 56 V140 H580" marker-end="url(#arrow)"/>
  <rect class="box" x="480" y="116" width="100" height="48" rx="4"/>
  <text x="530" y="146" text-anchor="middle" font-size="20">≠ ?</text>
  <text class="lbl" x="598" y="112">is it saturating</text>
  <path class="wire-soft" d="M45 56 V238 H470" marker-end="url(#arrow)"/>
  <path class="wire-soft" d="M880 56 V238 H670" marker-end="url(#arrow)"/>
  <rect class="box" x="470" y="214" width="200" height="48" rx="4"/>
  <text x="570" y="244" text-anchor="middle" font-size="17">sign e = sign u ?</text>
  <text class="lbl" x="200" y="228">is the integrator making it worse</text>
  <path class="wire" d="M530 164 V196 H730" marker-end="url(#arrow)"/>
  <path class="wire" d="M670 238 H730" marker-end="url(#arrow)"/>
  <rect class="box-accent" x="730" y="166" width="90" height="100" rx="4"/>
  <text x="775" y="222" text-anchor="middle" font-size="18">AND</text>
  <path class="wire" d="M820 216 H900 V300 H160 V82" marker-end="url(#arrow)"/>
  <text class="lbl-strong" x="420" y="292">when both hold, the integrator's input becomes zero</text>
</svg>
