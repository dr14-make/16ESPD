<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420">
  <style>
    text { font-family: sans-serif; fill: #16202c; }
    .chip { fill: #16202c; }
    .chip-t { font-size: 14px; font-weight: 600; fill: #fff; }
    .pole-n { fill: #eaf1fa; stroke: #1f5fa8; stroke-width: 1.5; }
    .pole-s { fill: #f7ecdf; stroke: #a75d00; stroke-width: 1.5; }
    .n { font-size: 16px; font-weight: 600; fill: #1f5fa8; }
    .s { font-size: 16px; font-weight: 600; fill: #a75d00; }
    .field { stroke: #1f5fa8; stroke-width: 1.3; fill: none; opacity: 0.6; }
    .axis { stroke: #16202c; stroke-width: 2; fill: none; }
    .wire { stroke: #16202c; stroke-width: 2; fill: none; }
    .guide { stroke: #4a5a6b; stroke-width: 1; fill: none; stroke-dasharray: 4 4; }
    .dim { stroke: #4a5a6b; stroke-width: 1.5; fill: none; }
    .sig { stroke: #1f5fa8; stroke-width: 3; fill: none; stroke-linejoin: round; }
    .lbl { font-size: 14px; fill: #4a5a6b; }
    .sym { font-size: 15px; font-weight: 600; }
    .halo { paint-order: stroke; stroke: #fff; stroke-width: 5px; stroke-linejoin: round; }
  </style>
  <defs>
    <marker id="aw-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4a5a6b"/></marker>
    <marker id="aw-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#16202c"/></marker>
  </defs>

  <!-- sensor chip, two wires to the ECU -->
  <rect class="chip" x="250" y="34" width="100" height="40" rx="4"/>
  <text x="300" y="59" text-anchor="middle" class="chip-t">Hall / MR IC</text>
  <path class="wire" d="M280 34 V16 H420"/>
  <path class="wire" d="M320 34 V24 H420"/>
  <text x="428" y="25" class="lbl">2 wires → ECU</text>

  <!-- air gap -->
  <path class="dim" d="M364 76 V103" marker-start="url(#aw-dim)" marker-end="url(#aw-dim)"/>
  <text x="372" y="94" class="lbl halo">air gap</text>

  <!-- field lines between neighboring poles -->
  <path class="field" d="M72 105 Q105 66 138 105"/>
  <path class="field" d="M202 105 Q235 66 268 105"/>
  <path class="field" d="M332 105 Q365 66 398 105"/>
  <path class="field" d="M462 105 Q495 66 528 105"/>
  <path class="field" d="M138 105 Q170 76 202 105"/>
  <path class="field" d="M268 105 Q300 76 332 105"/>
  <path class="field" d="M398 105 Q430 76 462 105"/>

  <!-- encoder ring, unrolled -->
  <rect class="pole-n" x="40" y="105" width="65" height="38"/>
  <rect class="pole-s" x="105" y="105" width="65" height="38"/>
  <rect class="pole-n" x="170" y="105" width="65" height="38"/>
  <rect class="pole-s" x="235" y="105" width="65" height="38"/>
  <rect class="pole-n" x="300" y="105" width="65" height="38"/>
  <rect class="pole-s" x="365" y="105" width="65" height="38"/>
  <rect class="pole-n" x="430" y="105" width="65" height="38"/>
  <rect class="pole-s" x="495" y="105" width="65" height="38"/>
  <text x="72" y="130" text-anchor="middle" class="n">N</text>
  <text x="138" y="130" text-anchor="middle" class="s">S</text>
  <text x="202" y="130" text-anchor="middle" class="n">N</text>
  <text x="268" y="130" text-anchor="middle" class="s">S</text>
  <text x="332" y="130" text-anchor="middle" class="n">N</text>
  <text x="398" y="130" text-anchor="middle" class="s">S</text>
  <text x="462" y="130" text-anchor="middle" class="n">N</text>
  <text x="528" y="130" text-anchor="middle" class="s">S</text>

  <path class="axis" d="M120 166 H48" marker-end="url(#aw-ink)"/>
  <text x="130" y="171" class="lbl">ring in the bearing seal, unrolled · 48 N–S pairs per turn</text>

  <!-- each pole edge passing the chip gives one current pulse -->
  <path class="guide" d="M105 184 V280"/>
  <path class="guide" d="M170 184 V280"/>
  <path class="guide" d="M235 184 V280"/>
  <path class="guide" d="M300 184 V280"/>
  <path class="guide" d="M365 184 V280"/>
  <path class="guide" d="M430 184 V280"/>
  <path class="guide" d="M495 184 V280"/>

  <!-- current against time -->
  <path class="axis" d="M40 380 V200" marker-end="url(#aw-ink)"/>
  <path class="axis" d="M40 380 H574" marker-end="url(#aw-ink)"/>
  <text x="26" y="206" text-anchor="middle" class="sym">I</text>
  <text x="572" y="400" text-anchor="end" class="sym">t</text>
  <path class="guide" d="M40 330 H560"/>
  <path class="guide" d="M40 280 H560"/>
  <text x="34" y="335" text-anchor="end" class="lbl">7</text>
  <text x="34" y="285" text-anchor="end" class="lbl">14</text>
  <text x="34" y="385" text-anchor="end" class="lbl">0</text>
  <text x="12" y="240" class="lbl" transform="rotate(-90 12 240)">mA</text>

  <path class="sig" d="M40 330 H105 V280 H117 V330 H170 V280 H182 V330 H235 V280 H247 V330 H300 V280 H312 V330 H365 V280 H377 V330 H430 V280 H442 V330 H495 V280 H507 V330 H560"/>

  <path class="dim" d="M235 300 H300" marker-start="url(#aw-dim)" marker-end="url(#aw-dim)"/>
  <text x="267" y="318" text-anchor="middle" class="sym halo">T</text>
  <text x="560" y="352" text-anchor="end" class="lbl">pulse 90 µs forward, 180 µs reverse</text>
  <text x="50" y="372" class="lbl">below 7 mA: open wire or a fault, never a signal</text>
</svg>
