<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 330" width="1160" height="330">
  <style>
    text { font-family: sans-serif; fill: #16202c; }
    .box { fill: #fff; stroke: #16202c; stroke-width: 2; }
    .box-accent { fill: #eaf1fa; stroke: #1f5fa8; stroke-width: 2; }
    .arrow { stroke: #16202c; stroke-width: 3; fill: none; }
    .t { font-size: 17px; font-weight: 600; }
    .lbl { font-size: 14px; fill: #4a5a6b; }
    .code { font-size: 13px; font-family: monospace; fill: #1f5fa8; }
    .gain { font-size: 15px; font-weight: 600; fill: #a75d00; }
    .box-real { fill: #fff; stroke: #4a5a6b; stroke-width: 2; stroke-dasharray: 6 4; }
  </style>
  <defs>
    <marker id="fc-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#16202c"/></marker>
  </defs>

  <text x="40" y="96" text-anchor="middle" class="t">foot</text>
  <text x="40" y="118" text-anchor="middle" class="lbl">F_ped</text>
  <text x="40" y="138" text-anchor="middle" class="lbl">≤ 500 N</text>
  <path class="arrow" d="M70 110 H108" marker-end="url(#fc-ink)"/>

  <rect class="box-accent" x="112" y="70" width="150" height="80" rx="4"/>
  <text x="187" y="102" text-anchor="middle" class="t">pedal lever</text>
  <text x="187" y="128" text-anchor="middle" class="gain">× 3.5</text>
  <text x="187" y="172" text-anchor="middle" class="code">BrakePedal</text>
  <path class="arrow" d="M262 110 H300" marker-end="url(#fc-ink)"/>
  <text x="281" y="98" text-anchor="middle" class="lbl">F_rod</text>

  <rect class="box-accent" x="304" y="70" width="170" height="80" rx="4"/>
  <text x="389" y="102" text-anchor="middle" class="t">vacuum booster</text>
  <text x="389" y="128" text-anchor="middle" class="gain">× 5 to run-out</text>
  <text x="389" y="172" text-anchor="middle" class="code">StaticBooster</text>
  <path class="arrow" d="M474 110 H512" marker-end="url(#fc-ink)"/>
  <text x="493" y="98" text-anchor="middle" class="lbl">F_out</text>

  <rect class="box-accent" x="516" y="70" width="180" height="80" rx="4"/>
  <text x="606" y="100" text-anchor="middle" class="t">tandem master</text>
  <text x="606" y="120" text-anchor="middle" class="t">cylinder</text>
  <text x="606" y="142" text-anchor="middle" class="gain">p = F / A_mc</text>
  <text x="606" y="172" text-anchor="middle" class="code">TandemMasterCylinder</text>

  <path class="arrow" d="M696 92 H730 V64 H946" marker-end="url(#fc-ink)"/>
  <path class="arrow" d="M696 128 H730 V192 H742" marker-end="url(#fc-ink)"/>
  <rect class="box-real" x="746" y="148" width="180" height="88" rx="4"/>
  <text x="836" y="174" text-anchor="middle" class="t">proportioning valve</text>
  <text x="836" y="198" text-anchor="middle" class="gain">× 0.43 above 45 bar</text>
  <text x="836" y="222" text-anchor="middle" class="lbl">real cars; not in our model</text>
  <path class="arrow" d="M926 192 H946" marker-end="url(#fc-ink)"/>
  <text x="760" y="56" text-anchor="middle" class="lbl">front</text>
  <text x="712" y="150" text-anchor="middle" class="lbl">rear</text>

  <rect class="box-accent" x="950" y="22" width="200" height="84" rx="4"/>
  <text x="1050" y="46" text-anchor="middle" class="t">line + caliper</text>
  <text x="1050" y="68" text-anchor="middle" class="gain">front axle 49 N·m/bar</text>
  <text x="1050" y="92" text-anchor="middle" class="code">BrakeLine · BrakeCaliper</text>
  <rect class="box-accent" x="950" y="150" width="200" height="84" rx="4"/>
  <text x="1050" y="174" text-anchor="middle" class="t">line + caliper</text>
  <text x="1050" y="196" text-anchor="middle" class="gain">rear axle 20 N·m/bar</text>
  <text x="1050" y="220" text-anchor="middle" class="code">BrakeLine · BrakeCaliper</text>
  <text x="1150" y="258" text-anchor="end" class="lbl">both calipers in <tspan class="code">HydraulicBrakedWheel</tspan></text>

  <text x="480" y="284" text-anchor="middle" class="lbl">Notebook 02 runs the chain to the master cylinder; build 02 runs all of it on your car.</text>
  <text x="480" y="308" text-anchor="middle" class="lbl">Gains are the model's defaults: lever and servo ratio assumed, 25 mm bore and booster from the PATH test car.</text>
</svg>
