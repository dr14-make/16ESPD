<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340">
  <style>
    text { font-family: sans-serif; fill: #16202c; }
    .box { fill: #fff; stroke: #16202c; stroke-width: 2; }
    .box-accent { fill: #eaf1fa; stroke: #1f5fa8; stroke-width: 2; }
    .clock { fill: none; stroke: #1f5fa8; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .arrow { stroke: #16202c; stroke-width: 3; fill: none; }
    .t { font-size: 17px; font-weight: 600; }
    .lbl { font-size: 14px; fill: #4a5a6b; }
    .sig { font-size: 15px; font-weight: 600; }
    .code { font-size: 12px; font-family: monospace; fill: #1f5fa8; }
  </style>
  <defs>
    <marker id="al-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#16202c"/></marker>
  </defs>

  <rect class="clock" x="20" y="14" width="470" height="200" rx="8"/>
  <text x="30" y="34" class="lbl">ECU, sampled every 5 ms</text>

  <rect class="box-accent" x="40" y="70" width="190" height="90" rx="4"/>
  <text x="135" y="98" text-anchor="middle" class="t">speed estimator</text>
  <text x="135" y="120" text-anchor="middle" class="lbl">v_ref falls at most a_ref</text>
  <text x="135" y="140" text-anchor="middle" class="lbl">λ = (ωr − v_ref) / v_ref</text>
  <text x="135" y="62" text-anchor="middle" class="code">ABSWheelOnlyEstimatorDiscrete</text>

  <path class="arrow" d="M230 115 H276" marker-end="url(#al-ink)"/>
  <text x="252" y="104" text-anchor="middle" class="sig">λ</text>

  <rect class="box-accent" x="280" y="70" width="190" height="90" rx="4"/>
  <text x="375" y="98" text-anchor="middle" class="t">modulator</text>
  <text x="375" y="120" text-anchor="middle" class="lbl">build · hold · dump</text>
  <text x="375" y="140" text-anchor="middle" class="lbl">remembers lock torque</text>
  <text x="375" y="62" text-anchor="middle" class="code">ABSModulatorDiscrete</text>

  <path class="arrow" d="M375 270 V164" marker-end="url(#al-ink)"/>
  <text x="385" y="262" class="lbl">driver's demand</text>

  <path class="arrow" d="M470 115 H556" marker-end="url(#al-ink)"/>
  <text x="512" y="104" text-anchor="middle" class="sig">τ_cmd</text>

  <rect class="box" x="560" y="70" width="170" height="90" rx="4"/>
  <text x="645" y="98" text-anchor="middle" class="t">brake actuator</text>
  <text x="645" y="120" text-anchor="middle" class="lbl">hydraulics as a</text>
  <text x="645" y="140" text-anchor="middle" class="lbl">30 ms first-order lag</text>
  <text x="645" y="62" text-anchor="middle" class="code">BrakeActuator</text>

  <path class="arrow" d="M730 115 H776" marker-end="url(#al-ink)"/>
  <text x="753" y="104" text-anchor="middle" class="sig">τ_b</text>

  <rect class="box" x="780" y="70" width="190" height="90" rx="4"/>
  <text x="875" y="98" text-anchor="middle" class="t">wheel + tire + car</text>
  <text x="875" y="120" text-anchor="middle" class="lbl">J ω̇ = r |F_x| − τ_b</text>
  <text x="875" y="140" text-anchor="middle" class="lbl">F_x = μ(κ) F_z</text>
  <text x="875" y="62" text-anchor="middle" class="code">BrakedWheel · TireFrictionCurve</text>

  <path class="arrow" d="M875 160 V300 H135 V164" marker-end="url(#al-ink)"/>
  <text x="620" y="292" text-anchor="middle" class="sig">ω, the wheel speed: the only thing it measures</text>
</svg>
