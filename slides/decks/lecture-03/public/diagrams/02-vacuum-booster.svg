<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520">
  <style>
    text { font-family: sans-serif; fill: #16202c; }
    .shell { fill: none; stroke: #16202c; stroke-width: 3; }
    .air { fill: #f6e3cc; }
    .vac { fill: #dbe7f3; }
    .rubber { fill: #d9b38c; stroke: #16202c; stroke-width: 1.5; }
    .hub { fill: #c9d1d9; stroke: #16202c; stroke-width: 2; }
    .plunger { fill: #6fbf73; stroke: #16202c; stroke-width: 1.5; }
    .disc { fill: #b9a3d6; stroke: #16202c; stroke-width: 1.5; }
    .metal { fill: #ffffff; stroke: #16202c; stroke-width: 2.5; }
    .rod { stroke: #16202c; stroke-width: 8; stroke-linecap: round; fill: none; }
    .lever { stroke: #4a5a6b; stroke-width: 16; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .spring { stroke: #4a5a6b; stroke-width: 2; fill: none; }
    .hose { stroke: #1f5fa8; stroke-width: 6; fill: none; stroke-linecap: round; }
    .airflow { stroke: #a75d00; stroke-width: 2.5; fill: none; stroke-dasharray: 7 4; }
    .vacflow { stroke: #1f5fa8; stroke-width: 2.5; fill: none; stroke-dasharray: 7 4; }
    .push { stroke: #a75d00; stroke-width: 3.5; fill: none; }
    .leader { stroke: #4a5a6b; stroke-width: 1; fill: none; }
    .lbl { font-size: 15px; fill: #16202c; }
    .small { font-size: 13px; fill: #4a5a6b; }
    .blue { font-size: 15px; font-weight: 600; fill: #1f5fa8; }
    .orange { font-size: 15px; font-weight: 600; fill: #a75d00; }
  </style>
  <defs>
    <marker id="vb-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a75d00"/></marker>
    <marker id="vb-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1f5fa8"/></marker>
  </defs>

  <!-- brake pedal and push rod -->
  <path class="lever" d="M110 92 L128 262 L104 420"/>
  <rect x="62" y="412" width="62" height="18" rx="4" fill="#4a5a6b" transform="rotate(-20 93 421)"/>
  <circle cx="110" cy="92" r="11" fill="#ffffff" stroke="#16202c" stroke-width="3"/>
  <path class="rod" d="M128 262 H350"/>
  <text class="lbl" x="30" y="478">brake pedal</text>
  <text class="lbl" x="180" y="282">push rod</text>

  <!-- booster can: rear chamber filled with air, front chamber with vacuum -->
  <path class="vac" d="M452 40 H500 Q560 40 560 100 V420 Q560 480 500 480 H452 Z"/>
  <path class="air" d="M452 40 H430 Q370 40 370 100 V420 Q370 480 430 480 H452 Z"/>
  <path class="shell" d="M430 40 H500 Q560 40 560 100 V420 Q560 480 500 480 H430 Q370 480 370 420 V100 Q370 40 430 40 Z"/>

  <!-- diaphragm -->
  <path class="rubber" d="M447 44 Q463 140 449 214 L459 214 Q473 140 457 44 Z"/>
  <path class="rubber" d="M449 306 Q463 380 447 476 L457 476 Q473 380 459 306 Z"/>

  <!-- valve body (hub) through the rear shell -->
  <rect class="hub" x="290" y="214" width="178" height="92" rx="6"/>
  <rect x="363" y="206" width="14" height="8" fill="#16202c"/>
  <rect x="363" y="306" width="14" height="8" fill="#16202c"/>
  <!-- air filter at the open rear end -->
  <path d="M292 226 V294" stroke="#a75d00" stroke-width="6" stroke-dasharray="3 3"/>
  <!-- valve springs -->
  <path class="spring" d="M300 236 l6 -6 l6 12 l6 -12 l6 12 l6 -12 l6 12 l6 -6"/>
  <path class="spring" d="M300 284 l6 -6 l6 12 l6 -12 l6 12 l6 -12 l6 12 l6 -6"/>
  <!-- plunger on the push rod -->
  <rect class="plunger" x="350" y="244" width="52" height="32" rx="4"/>
  <!-- air channel into the rear chamber -->
  <rect x="404" y="210" width="14" height="10" fill="#f6e3cc"/>
  <!-- reaction disc and output rod -->
  <rect class="disc" x="468" y="238" width="16" height="44" rx="3"/>
  <path class="rod" d="M484 260 H612"/>

  <!-- return spring in the front chamber -->
  <path class="spring" d="M470 196 l8 -9 l8 18 l8 -18 l8 18 l8 -18 l8 18 l8 -18 l8 18 l8 -18 l6 9"/>
  <path class="spring" d="M470 324 l8 -9 l8 18 l8 -18 l8 18 l8 -18 l8 18 l8 -18 l8 18 l8 -18 l6 9"/>

  <!-- master cylinder and reservoir -->
  <rect class="metal" x="660" y="222" width="34" height="34" rx="6"/>
  <rect class="metal" x="612" y="246" width="164" height="60" rx="10"/>
  <text class="lbl" x="626" y="282">master cylinder</text>
  <text class="small" x="700" y="240">reservoir</text>

  <!-- vacuum source: hose and check valve -->
  <path class="hose" d="M560 420 H780"/>
  <circle cx="640" cy="420" r="12" fill="#ffffff" stroke="#1f5fa8" stroke-width="3"/>
  <path d="M647 420 L634 412 V428 Z" fill="#1f5fa8"/>
  <text class="small" x="610" y="448">check valve</text>
  <text class="blue" x="672" y="404">to the engine</text>

  <!-- outside air: filter, valve, air channel, rear chamber -->
  <path class="airflow" d="M200 236 H296 Q340 232 380 224 L411 224 V160" marker-end="url(#vb-warn)"/>
  <text class="orange" x="150" y="196">outside air,</text>
  <text class="orange" x="150" y="214">when pressed</text>
  <!-- vacuum channel: front chamber to the valve, shut when pressed -->
  <path class="vacflow" d="M520 300 Q490 296 470 296 H392" marker-end="url(#vb-blue)"/>

  <!-- pressure difference on the diaphragm -->
  <path class="push" d="M388 120 H438" marker-end="url(#vb-warn)"/>
  <path class="push" d="M388 400 H438" marker-end="url(#vb-warn)"/>

  <!-- chamber labels -->
  <text class="orange" x="200" y="62">rear chamber</text>
  <text class="orange" x="200" y="80">air, up to 101 kPa</text>
  <path class="leader" d="M342 74 L392 84"/>
  <text class="blue" x="590" y="62">front chamber</text>
  <text class="blue" x="590" y="80">vacuum, 33 kPa</text>
  <path class="leader" d="M586 74 L536 84"/>

  <!-- part labels -->
  <text class="lbl" x="232" y="356">valve and plunger</text>
  <path class="leader" d="M330 342 L370 278"/>
  <text class="lbl" x="232" y="378">vacuum channel, shut</text>
  <text class="lbl" x="232" y="396">when pressed</text>
  <path class="leader" d="M380 372 L420 298"/>
  <text class="lbl" x="590" y="160">return spring</text>
  <path class="leader" d="M588 156 L540 190"/>
  <text class="lbl" x="590" y="344">reaction disc</text>
  <path class="leader" d="M588 338 L486 280"/>
  <text class="lbl" x="420" y="506">diaphragm</text>
  <path class="leader" d="M452 492 L452 476"/>
</svg>
