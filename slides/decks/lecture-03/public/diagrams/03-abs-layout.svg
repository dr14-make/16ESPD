<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" width="680" height="470">
  <style>
    text { font-family: sans-serif; fill: #16202c; }
    .body { fill: #fff; stroke: #16202c; stroke-width: 2; }
    .wheel { fill: #16202c; }
    .box { fill: #fff; stroke: #16202c; stroke-width: 2; }
    .box-accent { fill: #eaf1fa; stroke: #1f5fa8; stroke-width: 2; }
    .line { stroke: #16202c; stroke-width: 4; fill: none; }
    .sig { stroke: #1f5fa8; stroke-width: 1.5; fill: none; }
    .sensor { fill: #1f5fa8; }
    .v { font-size: 15px; font-weight: 600; }
    .lbl { font-size: 15px; fill: #4a5a6b; }
    .ld { font-size: 15px; font-weight: 600; fill: #1f5fa8; }
  </style>

  <!-- car, front at the top -->
  <rect class="body" x="220" y="30" width="240" height="390" rx="50"/>
  <rect class="wheel" x="198" y="70" width="22" height="60" rx="4"/>
  <rect class="wheel" x="460" y="70" width="22" height="60" rx="4"/>
  <rect class="wheel" x="198" y="310" width="22" height="60" rx="4"/>
  <rect class="wheel" x="460" y="310" width="22" height="60" rx="4"/>

  <!-- master cylinder and the hydraulic unit with its ECU -->
  <rect class="box" x="236" y="140" width="56" height="32" rx="4"/>
  <text x="264" y="161" text-anchor="middle" class="v">MC</text>
  <rect class="box-accent" x="336" y="140" width="104" height="50" rx="4"/>
  <text x="388" y="161" text-anchor="middle" class="v">valves</text>
  <text x="388" y="180" text-anchor="middle" class="v">+ pump</text>
  <rect class="box-accent" x="358" y="112" width="60" height="28" rx="4"/>
  <text x="388" y="132" text-anchor="middle" class="v">ECU</text>
  <path class="line" d="M292 156 H336"/>

  <!-- brake lines to the four wheels -->
  <path class="line" d="M346 140 V100 H220"/>
  <path class="line" d="M440 150 H448 V100 H460"/>
  <path class="line" d="M348 190 V340 H220"/>
  <path class="line" d="M364 190 V326 H460"/>

  <!-- wheel-speed sensors and their wires to the ECU -->
  <rect class="sensor" x="182" y="94" width="12" height="12" rx="2"/>
  <rect class="sensor" x="486" y="94" width="12" height="12" rx="2"/>
  <rect class="sensor" x="182" y="334" width="12" height="12" rx="2"/>
  <rect class="sensor" x="486" y="334" width="12" height="12" rx="2"/>
  <path class="sig" d="M188 94 V16 H382 V112"/>
  <path class="sig" d="M182 340 H170 V16 H188"/>
  <path class="sig" d="M492 94 V16 H394 V112"/>
  <path class="sig" d="M498 340 H510 V16 H492"/>

  <text x="528" y="96" class="ld">wheel-speed</text>
  <text x="528" y="114" class="ld">sensor at</text>
  <text x="528" y="132" class="ld">every wheel</text>

  <!-- legend -->
  <text x="20" y="440" class="lbl">MC: master cylinder, behind the pedal and booster</text>
  <text x="20" y="462" class="lbl">valves + pump, with its ECU: the hydraulic unit</text>
  <path class="line" d="M520 432 H560"/>
  <text x="568" y="437" class="lbl">brake line</text>
  <path class="sig" d="M520 456 H560"/>
  <text x="568" y="461" class="lbl">signal</text>
</svg>
