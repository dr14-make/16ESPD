<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <style>
    text { font-family: sans-serif; fill: #16202c; }
    .body { fill: #fff; stroke: #16202c; stroke-width: 2; }
    .wheel { fill: #16202c; }
    .mc { fill: #eaf1fa; stroke: #1f5fa8; stroke-width: 2; }
    .c1 { stroke: #1f5fa8; stroke-width: 4; fill: none; }
    .c2 { stroke: #a75d00; stroke-width: 4; fill: none; stroke-dasharray: 9 5; }
    .t { font-size: 18px; font-weight: 600; }
    .lbl { font-size: 14px; fill: #4a5a6b; }
  </style>

  <!-- II split: front/rear -->
  <text x="160" y="28" text-anchor="middle" class="t">II: front / rear</text>
  <rect class="body" x="100" y="50" width="120" height="250" rx="30"/>
  <rect class="wheel" x="82" y="80" width="18" height="44" rx="4"/>
  <rect class="wheel" x="220" y="80" width="18" height="44" rx="4"/>
  <rect class="wheel" x="82" y="226" width="18" height="44" rx="4"/>
  <rect class="wheel" x="220" y="226" width="18" height="44" rx="4"/>
  <rect class="mc" x="140" y="140" width="40" height="30" rx="3"/>
  <text x="160" y="160" text-anchor="middle" font-size="12">MC</text>
  <path class="c1" d="M150 140 V102 H100 M170 140 V102 H220"/>
  <path class="c2" d="M150 170 V248 H100 M170 170 V248 H220"/>
  <text x="160" y="330" text-anchor="middle" class="lbl">one circuit lost: front or rear gone</text>

  <!-- X split: diagonal -->
  <text x="480" y="28" text-anchor="middle" class="t">X: diagonal</text>
  <rect class="body" x="420" y="50" width="120" height="250" rx="30"/>
  <rect class="wheel" x="402" y="80" width="18" height="44" rx="4"/>
  <rect class="wheel" x="540" y="80" width="18" height="44" rx="4"/>
  <rect class="wheel" x="402" y="226" width="18" height="44" rx="4"/>
  <rect class="wheel" x="540" y="226" width="18" height="44" rx="4"/>
  <rect class="mc" x="460" y="140" width="40" height="30" rx="3"/>
  <text x="480" y="160" text-anchor="middle" font-size="12">MC</text>
  <path class="c1" d="M470 140 V102 H420 M470 170 V200 L540 230 V248"/>
  <path class="c2" d="M490 140 V102 H540 M490 170 V190 L420 225 V248"/>
  <text x="480" y="330" text-anchor="middle" class="lbl">one circuit lost: one front wheel always left</text>

  <path class="c1" d="M250 352 H280"/>
  <text x="286" y="357" class="lbl">circuit 1</text>
  <path class="c2" d="M360 352 H390"/>
  <text x="396" y="357" class="lbl">circuit 2</text>
</svg>
