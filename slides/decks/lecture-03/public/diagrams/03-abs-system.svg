  <text x="352" y="186" class="lbl">circuit 2</text>
  <path class="line" d="M430 40 V170"/>
  <path class="line" d="M430 270 V400"/>
  <!-- FL -->
  <path class="line" d="M430 40 H470"/>
  <rect class="box-accent" x="470" y="20" width="80" height="40" rx="4"/>
  <text x="510" y="38" text-anchor="middle" class="v">inlet</text>
  <text x="510" y="53" text-anchor="middle" class="s">NO</text>
  <path class="chk" d="M560 40 V70 H460 V40"/>
  <path d="M504 70 L516 64 L516 76 z" fill="#16202c"/>
  <path class="chk" d="M503 63 V77"/>
  <path class="line" d="M550 40 H1000"/>
  <rect class="box" x="1000" y="24" width="94" height="32" rx="4"/>
