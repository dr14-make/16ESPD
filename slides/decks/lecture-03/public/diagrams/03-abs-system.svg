  <text x="286" y="140" text-anchor="middle" class="t">master</text>
  <text x="286" y="162" text-anchor="middle" class="t">cylinder</text>
  <path class="line" d="M346 105 H430"/>
  <path class="line" d="M346 165 H410 V335 H430"/>
