  <path class="line" d="M86 135 H102" marker-end="url(#as-ink)"/>
  <rect class="box" x="106" y="105" width="100" height="60" rx="4"/>
  <text x="156" y="141" text-anchor="middle" class="t">booster</text>
  <path class="line" d="M206 135 H222" marker-end="url(#as-ink)"/>
  <rect class="box" x="226" y="80" width="120" height="110" rx="4"/>
