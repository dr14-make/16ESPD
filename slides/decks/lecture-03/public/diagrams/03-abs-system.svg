  <rect class="box" x="496" y="88" width="80" height="34" rx="4"/>
  <text x="536" y="110" text-anchor="middle" class="v">damper</text>
  <path class="ret" d="M496 105 H436" marker-end="url(#as-warn)"/>
  <!-- return path, circuit at 335 -->
  <path class="ret" d="M880 335 H846" marker-end="url(#as-warn)"/>
  <rect class="box" x="726" y="318" width="116" height="34" rx="4"/>
  <text x="784" y="340" text-anchor="middle" class="v">accumulator</text>
  <path class="ret" d="M726 335 H698" marker-end="url(#as-warn)"/>
  <rect class="box" x="610" y="318" width="84" height="34" rx="4"/>
  <text x="652" y="340" text-anchor="middle" class="v">pump</text>
  <path class="ret" d="M610 335 H580" marker-end="url(#as-warn)"/>
  <rect class="box" x="496" y="318" width="80" height="34" rx="4"/>
  <text x="536" y="340" text-anchor="middle" class="v">damper</text>
  <path class="ret" d="M496 335 H436" marker-end="url(#as-warn)"/>
  <!-- motor -->
  <path class="shaft" d="M652 122 V198 M652 242 V318"/>
  <circle cx="652" cy="220" r="22" fill="#fff" stroke="#16202c" stroke-width="2"/>
  <text x="652" y="226" text-anchor="middle" class="t">M</text>
  <text x="682" y="198" class="s">one motor, an eccentric</text>
  <text x="682" y="210" class="s">drives both pump elements</text>
  <!-- ECU, lamp -->
  <rect class="box-accent" x="236" y="296" width="134" height="76" rx="4"/>
  <text x="303" y="328" text-anchor="middle" class="t">ECU</text>
  <text x="303" y="350" text-anchor="middle" class="lbl">on the block</text>
  <path class="sig" d="M236 334 H176"/>
  <circle cx="160" cy="334" r="16" fill="#fff3d6" stroke="#a75d00" stroke-width="2"/>
  <text x="160" y="338" text-anchor="middle" font-size="10" font-weight="700" fill="#a75d00">ABS</text>
  <text x="160" y="368" text-anchor="middle" class="lbl">warning lamp</text>
  <!-- signal lines: ECU to the valve coils and the motor -->
  <path class="sig" d="M370 310 H384 V6 H880"/>
  <path class="sig" d="M510 6 V20 M880 6 V58"/>
  <path class="sig" d="M370 320 H392 V220 H630 M674 220 H880"/>
  <path class="sig" d="M510 220 V190 M510 220 V250 M880 220 V152 M880 220 V288"/>
  <path class="sig" d="M370 358 H392 V442 H880"/>
  <path class="sig" d="M510 442 V420 M880 442 V382"/>
  <path class="sig" d="M1186 40 V458 H303 V372"/>
  <text x="1196" y="12" text-anchor="end" class="lbl">active wheel-speed sensor at each wheel</text>
  <!-- legend -->
  <path class="line" d="M12 404 H52"/>
  <text x="60" y="409" class="lbl">brake fluid</text>
  <path class="ret" d="M12 426 H52"/>
  <text x="60" y="431" class="lbl">return flow</text>
  <path class="sig" d="M12 448 H52"/>
  <text x="60" y="453" class="lbl">signal</text>
  <text x="12" y="250" class="s">NO, NC: open, closed</text>
  <text x="12" y="264" class="s">without power</text>
  <path class="chk" d="M12 284 H48"/>
  <path d="M24 284 L36 278 L36 290 z" fill="#16202c"/>
  <path class="chk" d="M23 277 V291"/>
  <text x="56" y="288" class="s">check valve</text>
</svg>
