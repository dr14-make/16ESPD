  <text x="510" y="398" text-anchor="middle" class="v">inlet</text>
  <text x="510" y="413" text-anchor="middle" class="s">NO</text>
  <path class="chk" d="M560 400 V370 H460 V400"/>
  <path d="M504 370 L516 364 L516 376 z" fill="#16202c"/>
  <path class="chk" d="M503 363 V377"/>
  <path class="line" d="M550 400 H1000"/>
