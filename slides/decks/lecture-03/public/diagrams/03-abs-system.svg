<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 466" width="1200" height="466">
  <style>
    text { font-family: sans-serif; fill: #16202c; }
    .box { fill: #fff; stroke: #16202c; stroke-width: 2; }
    .box-accent { fill: #eaf1fa; stroke: #1f5fa8; stroke-width: 2; }
    .block { fill: #f3f6fa; stroke: #8a99a8; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .line { stroke: #16202c; stroke-width: 4; fill: none; }
    .chk { stroke: #16202c; stroke-width: 2; fill: none; }
    .ret { stroke: #a75d00; stroke-width: 4; fill: none; stroke-dasharray: 9 5; }
    .sig { stroke: #1f5fa8; stroke-width: 1.5; fill: none; }
    .shaft { stroke: #4a5a6b; stroke-width: 3; fill: none; }
    .sensor { fill: #1f5fa8; }
    .t { font-size: 17px; font-weight: 600; }
    .v { font-size: 14px; font-weight: 600; }
    .s { font-size: 11px; fill: #4a5a6b; }
    .lbl { font-size: 14px; fill: #4a5a6b; }
    .blk { font-size: 14px; fill: #4a5a6b; font-style: italic; }
  </style>
  <defs>
    <marker id="as-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#16202c"/></marker>
    <marker id="as-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a75d00"/></marker>
  </defs>

