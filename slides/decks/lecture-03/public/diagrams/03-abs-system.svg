  <text x="1047" y="175" text-anchor="middle" class="v">caliper</text>
  <circle cx="1124" cy="170" r="20" fill="#fff" stroke="#16202c" stroke-width="2"/>
  <text x="1124" y="175" text-anchor="middle" class="v">RR</text>
  <rect class="sensor" x="1148" y="164" width="12" height="12" rx="2"/>
  <path class="sig" d="M1160 170 H1186"/>
  <path class="line" d="M880 170 V152"/>
  <rect class="box-accent" x="844" y="118" width="72" height="34" rx="4"/>
  <text x="880" y="134" text-anchor="middle" class="v">outlet</text>
  <text x="880" y="147" text-anchor="middle" class="s">NC</text>
  <path class="ret" d="M880 118 V105"/>
  <!-- FR -->
  <path class="line" d="M430 270 H470"/>
  <rect class="box-accent" x="470" y="250" width="80" height="40" rx="4"/>
  <text x="510" y="268" text-anchor="middle" class="v">inlet</text>
  <text x="510" y="283" text-anchor="middle" class="s">NO</text>
  <path class="chk" d="M560 270 V300 H460 V270"/>
  <path d="M504 300 L516 294 L516 306 z" fill="#16202c"/>
  <path class="chk" d="M503 293 V307"/>
  <path class="line" d="M550 270 H1000"/>
  <rect class="box" x="1000" y="254" width="94" height="32" rx="4"/>
  <text x="1047" y="275" text-anchor="middle" class="v">caliper</text>
  <circle cx="1124" cy="270" r="20" fill="#fff" stroke="#16202c" stroke-width="2"/>
  <text x="1124" y="275" text-anchor="middle" class="v">FR</text>
