<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330">
  <style>
    text { font-family: sans-serif; fill: #16202c; }
    .box { fill: #eaf1fa; stroke: #1f5fa8; stroke-width: 2; }
    .sig { stroke: #00007f; stroke-width: 3; fill: none; }
    .hose { stroke: #00897b; stroke-width: 7; fill: none; stroke-linecap: round; }
    .port { fill: #00897b; }
    .t { font-size: 17px; font-weight: 600; }
    .h { font-size: 19px; font-weight: 600; fill: #4a5a6b; }
    .lbl { font-size: 14px; fill: #4a5a6b; }
    .code { font-size: 13px; font-family: monospace; fill: #1f5fa8; }
    .gas { font-size: 15px; font-weight: 600; fill: #00897b; }
    .warn { font-size: 15px; font-weight: 600; fill: #a75d00; }
  </style>
  <defs>
    <marker id="vp-sig" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#00007f"/></marker>
  </defs>

  <!-- before: two causal signal wires -->
  <text x="235" y="30" text-anchor="middle" class="h">before: two signal wires</text>
  <rect class="box" x="20" y="70" width="120" height="150" rx="4"/>
  <text x="80" y="140" text-anchor="middle" class="t">engine</text>
  <text x="80" y="162" text-anchor="middle" class="lbl">manifold</text>
  <rect class="box" x="330" y="70" width="120" height="150" rx="4"/>
  <text x="390" y="140" text-anchor="middle" class="t">booster</text>
  <text x="390" y="162" text-anchor="middle" class="lbl">front chamber</text>

  <path class="sig" d="M140 110 H326" marker-end="url(#vp-sig)"/>
  <text x="235" y="98" text-anchor="middle" class="code">p_m → p_src</text>
  <text x="235" y="130" text-anchor="middle" class="lbl">pressure, one way</text>
  <path class="sig" d="M330 185 H144" marker-end="url(#vp-sig)"/>
  <text x="235" y="173" text-anchor="middle" class="code">mdot_bst ← mdot_out</text>
  <text x="235" y="205" text-anchor="middle" class="lbl">air flow, back</text>

  <text x="235" y="262" text-anchor="middle" class="warn">two wires for one hose</text>
  <text x="235" y="284" text-anchor="middle" class="lbl">you write the sign: what leaves one side</text>
  <text x="235" y="302" text-anchor="middle" class="lbl">must be fed in as what enters the other</text>

  <path d="M500 40 V310" stroke="#c5ced8" stroke-width="2"/>

  <!-- now: one acausal hose connector -->
  <text x="765" y="30" text-anchor="middle" class="h">now: one hose, one connector</text>
  <rect class="box" x="560" y="70" width="140" height="150" rx="4"/>
  <text x="630" y="140" text-anchor="middle" class="t">engine</text>
  <text x="630" y="162" text-anchor="middle" class="code">vacuum</text>
  <rect class="box" x="830" y="70" width="140" height="150" rx="4"/>
  <text x="900" y="140" text-anchor="middle" class="t">booster</text>
  <text x="900" y="162" text-anchor="middle" class="code">vacuum</text>

  <path class="hose" d="M700 145 H830"/>
  <rect class="port" x="690" y="135" width="20" height="20" rx="3"/>
  <rect class="port" x="820" y="135" width="20" height="20" rx="3"/>
  <text x="765" y="112" text-anchor="middle" class="gas">p</text>
  <text x="765" y="130" text-anchor="middle" class="lbl">same at both ends</text>
  <text x="765" y="180" text-anchor="middle" class="gas">ṁ</text>
  <text x="765" y="198" text-anchor="middle" class="lbl">counted into each part</text>

  <text x="765" y="262" text-anchor="middle" class="code">connect(engine.vacuum, booster.vacuum)</text>
  <text x="765" y="284" text-anchor="middle" class="gas">p_engine = p_booster</text>
  <text x="765" y="304" text-anchor="middle" class="gas">ṁ_engine + ṁ_booster = 0</text>
</svg>
