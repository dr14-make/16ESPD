<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 310" width="880" height="310">
  <style>
    text { font-family: sans-serif; fill: #16202c; }
    .wave { stroke: #16202c; stroke-width: 3.5; fill: none; stroke-linejoin: round; }
    .gap { stroke: #d55e00; stroke-width: 2.5; stroke-dasharray: 6 5; fill: none; }
    .slot { stroke: #d0d7de; stroke-width: 1; }
    .ackbg { fill: #e3f1e8; }
    .t { font-size: 19px; font-weight: 600; }
    .f { font-size: 15px; font-weight: 600; }
    .bit { font-size: 17px; }
    .db { font-size: 17px; font-weight: 700; fill: #009e73; }
    .lbl { font-size: 15px; fill: #4a5a6b; }
    .err { font-size: 15px; font-weight: 600; fill: #d55e00; }
  </style>
  <rect class="ackbg" x="330" y="36" width="130" height="236"/>
  <line class="slot" x1="200" y1="36" x2="200" y2="272"/>
  <line class="slot" x1="330" y1="36" x2="330" y2="272"/>
  <line class="slot" x1="460" y1="36" x2="460" y2="272"/>
  <line class="slot" x1="590" y1="36" x2="590" y2="272"/>
  <line class="slot" x1="720" y1="36" x2="720" y2="272"/>
  <line class="slot" x1="850" y1="36" x2="850" y2="272"/>

  <text x="265" y="26" text-anchor="middle" class="f">CRC delimiter</text>
  <text x="395" y="26" text-anchor="middle" class="f">ACK slot</text>
  <text x="525" y="26" text-anchor="middle" class="f">ACK delimiter</text>
  <text x="720" y="26" text-anchor="middle" class="f">end of frame …</text>

  <text x="20" y="76" class="t">sender</text>
  <path class="wave" d="M200 56 H850"/>
  <text x="395" y="94" text-anchor="middle" class="lbl">sends recessive</text>

  <text x="20" y="146" class="t">receivers</text>
  <text x="20" y="166" class="lbl">every correct one</text>
  <path class="wave" d="M200 126 H330 V166 H460 V126 H850"/>
  <text x="395" y="190" text-anchor="middle" class="db">D</text>

  <text x="20" y="226" class="t">bus</text>
  <path class="gap" d="M330 206 H460"/>
  <path class="wave" d="M200 206 H330 V246 H460 V206 H850"/>
  <text x="265" y="266" text-anchor="middle" class="bit">r</text>
  <text x="395" y="266" text-anchor="middle" class="db">D</text>
  <text x="525" y="266" text-anchor="middle" class="bit">r</text>
  <text x="655" y="266" text-anchor="middle" class="bit">r</text>
  <text x="785" y="266" text-anchor="middle" class="bit">r</text>

  <text x="20" y="298" class="lbl">high recessive (r), low dominant (D)</text>
  <text x="850" y="298" text-anchor="end" class="err">dashed: nobody acknowledged, the slot stays recessive: ACK error</text>
</svg>
