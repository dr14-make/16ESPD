<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
  <style>
    text { font-family: sans-serif; fill: #16202c; }
    .lay { fill: #fff; stroke: #16202c; stroke-width: 2; }
    .can { fill: #eaf1fa; stroke: #1f5fa8; stroke-width: 2; }
    .num { fill: #16202c; }
    .numc { fill: #1f5fa8; }
    .d { fill: #fff; stroke: #16202c; stroke-width: 1.8; }
    .h { fill: #fbe3d4; stroke: #16202c; stroke-width: 1.8; }
    .ghost { fill: none; stroke: #9aa7b4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .arrow { stroke: #4a5a6b; stroke-width: 3; fill: none; }
    .nn { font-size: 22px; font-weight: 700; fill: #fff; }
    .t { font-size: 19px; font-weight: 600; }
    .j { font-size: 15px; fill: #4a5a6b; }
    .c { font-size: 14px; font-weight: 600; }
    .bits { font-size: 16px; font-family: monospace; }
    .lbl { font-size: 15px; fill: #4a5a6b; }
  </style>
  <defs>
    <marker id="osi-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4a5a6b"/></marker>
  </defs>
  <rect class="can" x="10" y="20" width="380" height="58" rx="5"/>
  <rect class="numc" x="10" y="20" width="46" height="58" rx="5"/>
  <text x="33" y="57" text-anchor="middle" class="nn">7</text>
  <text x="70" y="45" class="t">Application</text>
  <text x="70" y="67" class="j">what the data means</text>
  <rect class="lay" x="10" y="84" width="380" height="58" rx="5"/>
  <rect class="num" x="10" y="84" width="46" height="58" rx="5"/>
  <text x="33" y="121" text-anchor="middle" class="nn">6</text>
  <text x="70" y="109" class="t">Presentation</text>
  <text x="70" y="131" class="j">how values are written</text>
  <rect class="lay" x="10" y="148" width="380" height="58" rx="5"/>
  <rect class="num" x="10" y="148" width="46" height="58" rx="5"/>
  <text x="33" y="185" text-anchor="middle" class="nn">5</text>
  <text x="70" y="173" class="t">Session</text>
  <text x="70" y="195" class="j">open and close a dialogue</text>
  <rect class="lay" x="10" y="212" width="380" height="58" rx="5"/>
  <rect class="num" x="10" y="212" width="46" height="58" rx="5"/>
  <text x="33" y="249" text-anchor="middle" class="nn">4</text>
  <text x="70" y="237" class="t">Transport</text>
  <text x="70" y="259" class="j">split, order, confirm</text>
  <rect class="lay" x="10" y="276" width="380" height="58" rx="5"/>
  <rect class="num" x="10" y="276" width="46" height="58" rx="5"/>
  <text x="33" y="313" text-anchor="middle" class="nn">3</text>
  <text x="70" y="301" class="t">Network</text>
  <text x="70" y="323" class="j">addresses and routes</text>
  <rect class="can" x="10" y="340" width="380" height="58" rx="5"/>
  <rect class="numc" x="10" y="340" width="46" height="58" rx="5"/>
  <text x="33" y="377" text-anchor="middle" class="nn">2</text>
  <text x="70" y="365" class="t">Data link</text>
  <text x="70" y="387" class="j">frames, access, errors</text>
  <rect class="can" x="10" y="404" width="380" height="58" rx="5"/>
  <rect class="numc" x="10" y="404" width="46" height="58" rx="5"/>
  <text x="33" y="441" text-anchor="middle" class="nn">1</text>
  <text x="70" y="429" class="t">Physical</text>
  <text x="70" y="451" class="j">bits on a medium</text>
  <rect class="d" x="600" y="32" width="130" height="34"/>
  <text x="665.0" y="54" text-anchor="middle" class="c">data</text>
  <rect class="d" x="600" y="96" width="130" height="34"/>
  <text x="665.0" y="118" text-anchor="middle" class="c">data</text>
  <text x="742" y="118" class="lbl">often adds nothing</text>
  <rect class="d" x="600" y="160" width="130" height="34"/>
  <text x="665.0" y="182" text-anchor="middle" class="c">data</text>
  <text x="742" y="182" class="lbl">often adds nothing</text>
  <rect class="h" x="550" y="224" width="50" height="34"/>
  <text x="575.0" y="246" text-anchor="middle" class="c">H4</text>
  <rect class="d" x="600" y="224" width="130" height="34"/>
  <text x="665.0" y="246" text-anchor="middle" class="c">data</text>
  <rect class="h" x="500" y="288" width="50" height="34"/>
  <text x="525.0" y="310" text-anchor="middle" class="c">H3</text>
  <rect class="h" x="550" y="288" width="50" height="34"/>
  <text x="575.0" y="310" text-anchor="middle" class="c">H4</text>
  <rect class="d" x="600" y="288" width="130" height="34"/>
  <text x="665.0" y="310" text-anchor="middle" class="c">data</text>
  <rect class="h" x="450" y="352" width="50" height="34"/>
  <text x="475.0" y="374" text-anchor="middle" class="c">H2</text>
  <rect class="h" x="500" y="352" width="50" height="34"/>
  <text x="525.0" y="374" text-anchor="middle" class="c">H3</text>
  <rect class="h" x="550" y="352" width="50" height="34"/>
  <text x="575.0" y="374" text-anchor="middle" class="c">H4</text>
  <rect class="d" x="600" y="352" width="130" height="34"/>
  <text x="665.0" y="374" text-anchor="middle" class="c">data</text>
  <rect class="h" x="730" y="352" width="50" height="34"/>
  <text x="755.0" y="374" text-anchor="middle" class="c">T2</text>
  <text x="635.0" y="439" text-anchor="middle" class="bits">0 1 1 0 1 0 0 0 1 1 1 0 …</text>
  <path class="arrow" d="M420 30 V440" marker-end="url(#osi-arr)"/>
  <text x="440" y="472" class="lbl">sending: each layer wraps what it gets in its own</text>
  <text x="440" y="492" class="lbl">header (H) or trailer (T); receiving unwraps it</text>
  <rect class="can" x="10" y="482" width="16" height="14"/><text x="32" y="494" class="lbl">filled by classic CAN</text>
</svg>
