<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="1000" height="450">
  <style>
    text { font-family: sans-serif; fill: #16202c; }
    .box { fill: #fff; stroke: #16202c; stroke-width: 2; }
    .box-accent { fill: #eaf1fa; stroke: #1f5fa8; stroke-width: 2; }
    .inset { fill: #f6f8fa; stroke: #9aa7b4; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .canh { stroke: #1f5fa8; stroke-width: 3.5; fill: none; }
    .canl { stroke: #d55e00; stroke-width: 3.5; fill: none; }
    .wire { stroke: #16202c; stroke-width: 2; fill: none; }
    .res { fill: #fff; stroke: #16202c; stroke-width: 2; }
    .dot { fill: #16202c; }
    .meter { fill: #fff; stroke: #16202c; stroke-width: 2; }
    .t { font-size: 19px; font-weight: 600; }
    .lbl { font-size: 16px; fill: #4a5a6b; }
    .v { font-size: 17px; font-weight: 600; }
    .h { fill: #1f5fa8; }
    .l { fill: #d55e00; }
  </style>

  <!-- the two lines -->
  <path class="canh" d="M150 90 H850"/>
  <path class="canl" d="M150 160 H850"/>
  <text x="720" y="80" text-anchor="middle" class="v h">CAN_H</text>
  <text x="720" y="185" text-anchor="middle" class="v l">CAN_L</text>

  <!-- left end node -->
  <rect class="box-accent" x="20" y="40" width="160" height="170" rx="6"/>
  <text x="100" y="232" text-anchor="middle" class="t">engine ECU</text>
  <path class="wire" d="M120 90 H180 M120 160 H180 M120 90 V100 M120 150 V160"/>
  <rect class="res" x="108" y="100" width="24" height="50"/>
  <text x="102" y="131" text-anchor="end" class="v">120 Ω</text>

  <!-- right end node -->
  <rect class="box-accent" x="820" y="40" width="160" height="170" rx="6"/>
  <text x="900" y="232" text-anchor="middle" class="t">gearbox ECU</text>
  <path class="wire" d="M820 90 H880 M820 160 H880 M880 90 V100 M880 150 V160"/>
  <rect class="res" x="868" y="100" width="24" height="50"/>
  <text x="898" y="131" class="v">120 Ω</text>

  <!-- stub node -->
  <circle class="dot" cx="300" cy="90" r="5"/>
  <circle class="dot" cx="330" cy="160" r="5"/>
  <path class="canh" d="M300 90 V270"/>
  <path class="canl" d="M330 160 V270"/>
  <rect class="box" x="240" y="270" width="150" height="60" rx="6"/>
  <text x="315" y="306" text-anchor="middle" class="t">ABS ECU</text>
  <text x="315" y="352" text-anchor="middle" class="lbl">a short stub,</text>
  <text x="315" y="372" text-anchor="middle" class="lbl">no resistor</text>

  <!-- ohmmeter check -->
  <circle class="dot" cx="440" cy="90" r="5"/>
  <circle class="dot" cx="440" cy="160" r="5"/>
  <path class="wire" d="M440 90 V105 M440 145 V160" stroke-dasharray="4 3"/>
  <circle class="meter" cx="440" cy="125" r="20"/>
  <text x="440" y="132" text-anchor="middle" class="t">Ω</text>
  <text x="470" y="122" class="v">60 Ω = 120 Ω ∥ 120 Ω</text>
  <text x="470" y="143" class="lbl">ignition off; 120 Ω: one end missing</text>

  <!-- split termination inset -->
  <rect class="inset" x="450" y="250" width="530" height="190" rx="8"/>
  <text x="470" y="278" class="t">split termination, at an end node</text>
  <text x="470" y="330" class="v h">CAN_H</text>
  <text x="470" y="400" class="v l">CAN_L</text>
  <path class="wire" d="M540 324 H600 M680 324 H730 V359 M540 394 H600 M680 394 H730 V359 M730 359 H800"/>
  <rect class="res" x="600" y="312" width="80" height="24"/>
  <rect class="res" x="600" y="382" width="80" height="24"/>
  <text x="640" y="305" text-anchor="middle" class="v">60 Ω</text>
  <text x="640" y="375" text-anchor="middle" class="v">60 Ω</text>
  <circle class="dot" cx="730" cy="359" r="5"/>
  <path class="wire" d="M800 339 V379 M814 339 V379" stroke-width="3"/>
  <path class="wire" d="M814 359 H860 V384 M845 384 H875 M850 392 H870 M856 400 H864"/>
  <text x="807" y="330" text-anchor="middle" class="v">4.7 nF</text>
  <text x="880" y="365" class="lbl">ground</text>
  <text x="720" y="430" text-anchor="middle" class="lbl">still 120 Ω between the lines; the capacitor drains common-mode noise</text>
</svg>
