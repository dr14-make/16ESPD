<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
  <style>
    text { font-family: sans-serif; fill: #16202c; }
    .axis { stroke: #16202c; stroke-width: 1.5; fill: none; }
    .grid { stroke: #9aa7b4; stroke-width: 1; stroke-dasharray: 4 4; fill: none; }
    .bitline { stroke: #4a5a6b; stroke-width: 1.2; stroke-dasharray: 6 5; }
    .canh { stroke: #1f5fa8; stroke-width: 4; fill: none; stroke-linejoin: round; }
    .canl { stroke: #d55e00; stroke-width: 4; fill: none; stroke-linejoin: round; }
    .diff { stroke: #16202c; stroke-width: 4; fill: none; stroke-linejoin: round; }
    .band-h { fill: #1f5fa8; opacity: 0.15; }
    .band-l { fill: #d55e00; opacity: 0.15; }
    .t { font-size: 20px; font-weight: 600; }
    .lbl { font-size: 17px; fill: #4a5a6b; }
    .tick { font-size: 16px; fill: #4a5a6b; }
    .v { font-size: 18px; font-weight: 600; }
    .h { fill: #1f5fa8; }
    .l { fill: #d55e00; }
  </style>

  <text x="240" y="24" text-anchor="middle" class="t">recessive (1)</text>
  <text x="490" y="24" text-anchor="middle" class="t">dominant (0)</text>
  <text x="740" y="24" text-anchor="middle" class="t">recessive (1)</text>
  <line class="bitline" x1="372" y1="34" x2="372" y2="470"/>
  <line class="bitline" x1="612" y1="34" x2="612" y2="470"/>

  <!-- bus wires: y = 224 - 36 V -->
  <path class="axis" d="M120 40 V224 H870"/>
  <line class="grid" x1="120" y1="44" x2="870" y2="44"/>
  <line class="grid" x1="120" y1="134" x2="870" y2="134"/>
  <text x="112" y="50" text-anchor="end" class="tick">5 V</text>
  <text x="112" y="139" text-anchor="end" class="tick">2.5 V</text>
  <text x="112" y="229" text-anchor="end" class="tick">0 V</text>
  <rect class="band-h" x="385" y="80" width="215" height="14.4"/>
  <rect class="band-l" x="385" y="173.6" width="215" height="14.4"/>
  <path class="canl" d="M120 44 H360 L385 188 H600 L625 44 H870"/>
  <path class="canh" d="M120 222 H360 L385 80 H600 L625 222 H870"/>
  <text x="240" y="68" text-anchor="middle" class="v l">CAN_L ≈ 5 V</text>
  <text x="240" y="210" text-anchor="middle" class="v h">CAN_H ≈ 0 V</text>
  <text x="492" y="70" text-anchor="middle" class="v h">CAN_H 3.6–4 V</text>
  <text x="492" y="212" text-anchor="middle" class="v l">CAN_L 1–1.4 V</text>
  <text x="740" y="68" text-anchor="middle" class="v l">CAN_L ≈ 5 V</text>
  <text x="740" y="210" text-anchor="middle" class="v h">CAN_H ≈ 0 V</text>

  <!-- differential: y = 360 - 20 V -->
  <text x="20" y="272" class="t">difference CAN_H − CAN_L</text>
  <path class="axis" d="M120 286 V470"/>
  <line class="axis" x1="120" y1="360" x2="870" y2="360"/>
  <line class="grid" x1="120" y1="300" x2="870" y2="300"/>
  <line class="grid" x1="120" y1="460" x2="870" y2="460"/>
  <text x="112" y="306" text-anchor="end" class="tick">+3 V</text>
  <text x="112" y="366" text-anchor="end" class="tick">0 V</text>
  <text x="112" y="466" text-anchor="end" class="tick">−5 V</text>
  <path class="diff" d="M120 460 H360 L385 300 H600 L625 460 H870"/>
  <text x="240" y="448" text-anchor="middle" class="v">−5 V</text>
  <text x="492" y="290" text-anchor="middle" class="v">+2.2 to +3 V</text>
  <text x="740" y="448" text-anchor="middle" class="v">−5 V</text>
  <text x="495" y="494" text-anchor="middle" class="lbl">the lines swap sides; the large swing survives one wire broken or shorted</text>
</svg>
