<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520">
  <!-- same geometry as 04-ls-levels.svg, so the two compare side by side -->
  <style>
    text { font-family: sans-serif; fill: #16202c; }
    .axis { stroke: #16202c; stroke-width: 1.5; fill: none; }
    .grid { stroke: #9aa7b4; stroke-width: 1; stroke-dasharray: 4 4; fill: none; }
    .bitline { stroke: #4a5a6b; stroke-width: 1.2; stroke-dasharray: 6 5; }
    .canh { stroke: #1f5fa8; stroke-width: 4; fill: none; stroke-linejoin: round; }
    .canl { stroke: #d55e00; stroke-width: 4; fill: none; stroke-linejoin: round; }
    .diff { stroke: #16202c; stroke-width: 4; fill: none; stroke-linejoin: round; }
    .band { fill: #c9d2dc; }
    .t { font-size: 21px; font-weight: 600; }
    .lbl { font-size: 17px; fill: #4a5a6b; }
    .tick { font-size: 17px; fill: #4a5a6b; }
    .v { font-size: 19px; font-weight: 600; }
    .h { fill: #1f5fa8; }
    .l { fill: #d55e00; }
  </style>

  <text x="240" y="24" text-anchor="middle" class="t">recessive = 1</text>
  <text x="492" y="24" text-anchor="middle" class="t">dominant = 0</text>
  <text x="740" y="24" text-anchor="middle" class="t">recessive = 1</text>
  <text x="240" y="45" text-anchor="middle" class="lbl">left alone</text>
  <text x="492" y="45" text-anchor="middle" class="lbl">driven</text>
  <text x="740" y="45" text-anchor="middle" class="lbl">left alone</text>
  <line class="bitline" x1="372" y1="52" x2="372" y2="480"/>
  <line class="bitline" x1="612" y1="52" x2="612" y2="480"/>

  <!-- bus wires: y = 240 - 36 V -->
  <path class="axis" d="M120 56 V240 H870"/>
  <line class="grid" x1="120" y1="60" x2="870" y2="60"/>
  <line class="grid" x1="120" y1="114" x2="870" y2="114"/>
  <line class="grid" x1="120" y1="150" x2="870" y2="150"/>
  <line class="grid" x1="120" y1="186" x2="870" y2="186"/>
  <text x="112" y="66" text-anchor="end" class="tick">5 V</text>
  <text x="112" y="120" text-anchor="end" class="tick">3.5 V</text>
  <text x="112" y="156" text-anchor="end" class="tick">2.5 V</text>
  <text x="112" y="192" text-anchor="end" class="tick">1.5 V</text>
  <text x="112" y="246" text-anchor="end" class="tick">0 V</text>
  <path class="canh" d="M120 148 H360 L385 114 H600 L625 148 H870"/>
  <path class="canl" d="M120 152 H360 L385 186 H600 L625 152 H870"/>
  <text x="240" y="136" text-anchor="middle" class="v">both 2.5 V</text>
  <text x="492" y="104" text-anchor="middle" class="v h">CAN_H 3.5 V</text>
  <text x="492" y="212" text-anchor="middle" class="v l">CAN_L 1.5 V</text>
  <text x="740" y="136" text-anchor="middle" class="v">both 2.5 V</text>

  <!-- difference: y = 366 - 22 V -->
  <text x="20" y="280" class="t">difference CAN_H − CAN_L</text>
  <rect class="band" x="120" y="346.2" width="750" height="8.8"/>
  <path class="axis" d="M120 290 V480"/>
  <line class="axis" x1="120" y1="366" x2="870" y2="366"/>
  <line class="grid" x1="120" y1="322" x2="870" y2="322"/>
  <line class="grid" x1="120" y1="476" x2="870" y2="476"/>
  <text x="112" y="328" text-anchor="end" class="tick">2 V</text>
  <text x="112" y="372" text-anchor="end" class="tick">0 V</text>
  <text x="112" y="482" text-anchor="end" class="tick">−5 V</text>
  <path class="diff" d="M120 366 H360 L385 322 H600 L625 366 H870"/>
  <text x="240" y="390" text-anchor="middle" class="v">0 V</text>
  <text x="492" y="312" text-anchor="middle" class="v">2 V</text>
  <text x="740" y="390" text-anchor="middle" class="v">0 V</text>
  <text x="740" y="340" text-anchor="middle" class="lbl">0.5–0.9 V: undefined</text>
  <text x="495" y="432" text-anchor="middle" class="lbl">a receiver reads only the difference:</text>
  <text x="495" y="454" text-anchor="middle" class="lbl">above 0.9 V dominant, below 0.5 V recessive</text>
  <text x="495" y="510" text-anchor="middle" class="lbl">typical values · the small swing allows fast edges</text>
</svg>
