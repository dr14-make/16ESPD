<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 250" width="1100" height="250">
  <style>
    text { font-family: sans-serif; fill: #16202c; }
    .lane { fill: #f6f8fa; }
    .s1 { fill: #eaf1fa; stroke: #1f5fa8; stroke-width: 2; }
    .s2 { fill: #fbe3d4; stroke: #d55e00; stroke-width: 2; }
    .s3 { fill: #1f5fa8; stroke: #1f5fa8; stroke-width: 2; }
    .s4 { fill: #eaf1fa; stroke: #1f5fa8; stroke-width: 2; }
    .link { stroke: #4a5a6b; stroke-width: 1.5; stroke-dasharray: 4 4; }
    .ev { fill: #16202c; }
    .axis { stroke: #16202c; stroke-width: 2; fill: none; }
    .lane-t { font-size: 17px; font-weight: 600; }
    .n { font-size: 16px; font-weight: 600; }
    .nw { font-size: 16px; font-weight: 700; fill: #fff; }
    .lbl { font-size: 15px; fill: #4a5a6b; }
  </style>
  <defs>
    <marker id="lc-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#16202c"/></marker>
  </defs>

  <rect class="lane" x="0" y="20" width="1100" height="50"/>
  <rect class="lane" x="0" y="90" width="1100" height="50"/>
  <rect class="lane" x="0" y="160" width="1100" height="50"/>
  <text x="12" y="51" class="lane-t">sender ECU</text>
  <text x="12" y="121" class="lane-t">bus</text>
  <text x="12" y="191" class="lane-t">receiver ECU</text>

  <rect class="s1" x="150" y="26" width="380" height="38" rx="4"/>
  <text x="340" y="51" text-anchor="middle" class="n">1 · waits for the next frame: ≤ one period</text>

  <rect class="s2" x="530" y="96" width="80" height="38" rx="4"/>
  <text x="570" y="121" text-anchor="middle" class="n">2 · queue</text>
  <rect class="s3" x="610" y="96" width="80" height="38" rx="4"/>
  <text x="650" y="121" text-anchor="middle" class="nw">3 · wire</text>

  <rect class="s4" x="690" y="166" width="380" height="38" rx="4"/>
  <text x="880" y="191" text-anchor="middle" class="n">4 · waits for the receiving task: ≤ its period</text>

  <line class="link" x1="530" y1="64" x2="530" y2="96"/>
  <line class="link" x1="690" y1="134" x2="690" y2="166"/>
  <circle class="ev" cx="150" cy="45" r="6"/>
  <circle class="ev" cx="1070" cy="185" r="6"/>

  <path class="axis" d="M150 228 H1095" marker-end="url(#lc-ink)"/>
  <text x="150" y="246" class="lbl">the value changes</text>
    <text x="610" y="246" text-anchor="middle" class="lbl">2 + 3: under a millisecond</text>
  <text x="1070" y="246" text-anchor="end" class="lbl">the control law uses it · time, not to scale</text>
</svg>
