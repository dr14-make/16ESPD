<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" width="980" height="420">
  <style>
    text { font-family: sans-serif; fill: #16202c; }
    .wire { stroke: #16202c; stroke-width: 2; fill: none; }
    .lbl { font-size: 13px; fill: #4a5a6b; }
    .arrow      { stroke: #16202c; stroke-width: 3; fill: none; }
    .arrow-acc  { stroke: #1f5fa8; stroke-width: 3; fill: none; }
    .arrow-warn { stroke: #a75d00; stroke-width: 3; fill: none; }
    .arrow-dngr { stroke: #a81f16; stroke-width: 3; fill: none; }
    .arrow-ok   { stroke: #256b42; stroke-width: 3; fill: none; }
    .car-body  { fill: #eaf1fa; stroke: #16202c; stroke-width: 2.5; stroke-linejoin: round; }
    .car-glass { fill: #fff; stroke: #16202c; stroke-width: 2; }
    .tyre      { fill: #16202c; }
    .hub       { fill: #fff; }
    .road      { stroke: #16202c; stroke-width: 3; fill: none; }
    .ghost     { stroke: #4a5a6b; stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; }
    .f-lbl      { font-size: 16px; font-weight: 600; fill: #16202c; }
    .f-lbl-acc  { font-size: 16px; font-weight: 600; fill: #1f5fa8; }
    .f-lbl-warn { font-size: 16px; font-weight: 600; fill: #a75d00; }
    .f-lbl-dngr { font-size: 16px; font-weight: 600; fill: #a81f16; }
    .f-lbl-ok   { font-size: 16px; font-weight: 600; fill: #256b42; }
  </style>
  <defs>
    <marker id="f-ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#16202c"/></marker>
    <marker id="f-ar-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1f5fa8"/></marker>
    <marker id="f-ar-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a75d00"/></marker>
    <marker id="f-ar-dngr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a81f16"/></marker>
    <marker id="f-ar-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#256b42"/></marker>
  </defs>

  <path class="road" d="M40 360 L940 119"/>
  <path class="ghost" d="M40 360 H300"/>
  <path class="ghost" d="M160 360 A 120 120 0 0 0 155.9 328.9"/>
  <text class="f-lbl" x="170" y="346">α</text>

  <g transform="translate(470,245) rotate(-15) translate(-181,-154.7)">
    <path class="car-body" d="M18 118 L18 100 Q18 88 34 85 L92 78 L124 40 Q130 34 142 34 L232 34 Q244 34 252 42 L282 76 L342 82 Q356 85 356 100 L356 118 Z"/>
    <path class="car-glass" d="M132 46 L230 46 L256 74 L114 74 Z"/>
    <path class="wire" d="M182 46 V74"/>
    <circle class="tyre" cx="92"  cy="126" r="24"/><circle class="hub" cx="92"  cy="126" r="9"/>
    <circle class="tyre" cx="284" cy="126" r="24"/><circle class="hub" cx="284" cy="126" r="9"/>
  </g>

  <g transform="translate(470,245) rotate(-15) translate(-181,-154.7)">
    <path class="arrow-ok"   d="M300 150 H412" marker-end="url(#f-ar-ok)"/>
    <path class="arrow-warn" d="M92 150 H-34"  marker-end="url(#f-ar-warn)"/>
    <path class="arrow-dngr" d="M470 62 H358"  marker-end="url(#f-ar-dngr)"/>
  </g>

  <text class="f-lbl-ok"   x="612" y="242">F = T·i / r &#160; tractive</text>
  <text class="f-lbl-warn" x="96"  y="330">O_f &#160; rolling resistance</text>
  <text class="f-lbl-dngr" x="700" y="70">O_V &#160; aerodynamic drag</text>

  <path class="arrow" d="M453 182 V342" marker-end="url(#f-ar-ink)"/>
  <text class="f-lbl" x="462" y="336">m·g</text>
  <path class="arrow-acc" d="M453 182 L413 193" marker-end="url(#f-ar-acc)"/>
  <path class="ghost" d="M453 182 L493 331"/>
  <path class="ghost" d="M413 193 L453 342"/>
  <path class="ghost" d="M493 331 L453 342"/>
  <text class="f-lbl-acc" x="196" y="200">O_s = m·g·sin α</text>
  <circle cx="453" cy="182" r="5" fill="#16202c"/>

  <text class="lbl" x="40" y="400">O_z = m·dv/dt is whatever is left over. O_aux, the electrical loads, is not modeled here. Slope drawn steeper than 10 % for legibility.</text>
</svg>
