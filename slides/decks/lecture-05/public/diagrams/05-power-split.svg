<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380">
  <style>
    text { font-family: sans-serif; fill: #16202c; }
    .box { fill: #fff; stroke: #16202c; stroke-width: 2; }
    .box-e { fill: #eaf1fa; stroke: #1f5fa8; stroke-width: 2; }
    .box-f { fill: #fdf3e6; stroke: #a75d00; stroke-width: 2; }
    .ring { fill: none; stroke: #16202c; stroke-width: 10; }
    .sun { fill: #eaf1fa; stroke: #1f5fa8; stroke-width: 3; }
    .planet { fill: #fff; stroke: #16202c; stroke-width: 2; }
    .carrier { fill: none; stroke: #a75d00; stroke-width: 3; }
    .shaft { stroke: #16202c; stroke-width: 6; fill: none; }
    .dc { stroke: #a75d00; stroke-width: 3; fill: none; }
    .wheel { fill: #2b3440; stroke: #16202c; stroke-width: 2; }
    .b { font-size: 15px; font-weight: 600; }
    .lbl { font-size: 13px; fill: #4a5a6b; }
  </style>

  <rect class="box-f" x="20" y="150" width="120" height="70" rx="6"/>
  <text x="80" y="190" text-anchor="middle" class="b">engine</text>
  <path class="shaft" d="M140 185 H360"/>
  <text x="250" y="175" text-anchor="middle" class="lbl">carrier</text>

  <circle class="ring" cx="420" cy="185" r="95"/>
  <circle class="sun" cx="420" cy="185" r="30"/>
  <circle class="planet" cx="420" cy="122" r="28"/>
  <circle class="planet" cx="420" cy="248" r="28"/>
  <circle class="planet" cx="365" cy="185" r="22"/>
  <circle class="planet" cx="475" cy="185" r="22"/>
  <path class="carrier" d="M420 122 V248 M365 185 H475"/>
  <text x="410" y="80" text-anchor="end" class="lbl">sun</text>
  <text x="420" y="306" text-anchor="middle" class="lbl">ring</text>
  <text x="420" y="345" text-anchor="middle" class="b">planetary gear</text>

  <path class="shaft" d="M420 155 V60 H560"/>
  <rect class="box-e" x="560" y="30" width="120" height="60" rx="6"/>
  <text x="620" y="65" text-anchor="middle" class="b">MG1</text>
  <text x="620" y="110" text-anchor="middle" class="lbl">on the sun: sets engine speed</text>

  <path class="shaft" d="M515 185 H850"/>
  <rect class="box-e" x="560" y="210" width="120" height="60" rx="6"/>
  <text x="620" y="245" text-anchor="middle" class="b">MG2</text>
  <path class="shaft" d="M620 210 V185"/>
  <text x="620" y="290" text-anchor="middle" class="lbl">on the ring: drives the wheels</text>
  <rect class="box" x="760" y="160" width="90" height="50" rx="6"/>
  <text x="805" y="190" text-anchor="middle" class="b">final drive</text>
  <path class="shaft" d="M850 185 H900 V250"/>
  <rect class="wheel" x="865" y="250" width="70" height="30" rx="6"/>

  <rect class="box-e" x="770" y="20" width="200" height="60" rx="6"/>
  <text x="870" y="55" text-anchor="middle" class="b">inverters, battery</text>
  <path class="dc" d="M680 50 H770"/>
  <path class="dc" d="M950 80 V330 H735 V255 H680"/>
</svg>
