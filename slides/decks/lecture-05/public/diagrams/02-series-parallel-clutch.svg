<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 30 600 380" width="600" height="380">
  <style>
    text { font-family: sans-serif; fill: #16202c; }
    .box { fill: #fff; stroke: #16202c; stroke-width: 2; }
    .box-e { fill: #eaf1fa; stroke: #1f5fa8; stroke-width: 2; }
    .box-f { fill: #fdf3e6; stroke: #a75d00; stroke-width: 2; }
    .shaft { stroke: #16202c; stroke-width: 6; fill: none; }
    .dc { stroke: #a75d00; stroke-width: 3; fill: none; }
    .wheel { fill: #2b3440; stroke: #16202c; stroke-width: 2; }
    .b { font-size: 15px; font-weight: 600; }
    .lbl { font-size: 13px; fill: #4a5a6b; }
  </style>

  <rect class="box-f" x="20" y="60" width="110" height="60" rx="6"/>
  <text x="75" y="95" text-anchor="middle" class="b">engine</text>
  <path class="shaft" d="M130 90 H170"/>
  <rect class="box-e" x="170" y="60" width="120" height="60" rx="6"/>
  <text x="230" y="95" text-anchor="middle" class="b">generator</text>
  <path class="shaft" d="M290 90 H315"/>
  <rect class="box" x="315" y="70" width="58" height="40" rx="4"/>
  <text x="344" y="95" text-anchor="middle" class="lbl">clutch</text>
  <path class="shaft" d="M373 90 H540 V270 H445"/>
  <text x="458" y="78" text-anchor="middle" class="lbl">closed at steady cruise</text>

  <path class="dc" d="M230 120 V200 H390"/>
  <circle cx="330" cy="200" r="6" fill="#a75d00"/>
  <text x="320" y="225" text-anchor="end" class="lbl">DC link</text>
  <rect class="box-e" x="20" y="250" width="110" height="60" rx="6"/>
  <text x="75" y="285" text-anchor="middle" class="b">battery</text>
  <path class="dc" d="M130 280 H330 V200"/>

  <rect class="box-e" x="390" y="170" width="110" height="60" rx="6"/>
  <text x="445" y="205" text-anchor="middle" class="b">motor</text>
  <path class="shaft" d="M445 230 V310"/>
  <rect class="wheel" x="410" y="310" width="70" height="30" rx="6"/>
  <text x="445" y="365" text-anchor="middle" class="lbl">wheels</text>

  <text x="300" y="400" text-anchor="middle" class="lbl">clutch open: a series hybrid · clutch closed: the engine drives the wheels directly</text>
</svg>
