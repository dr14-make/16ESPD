<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 50 540 340" width="540" height="340">
  <style>
    text { font-family: sans-serif; fill: #16202c; }
    .box { fill: #fff; stroke: #16202c; stroke-width: 2; }
    .box-e { fill: #eaf1fa; stroke: #1f5fa8; stroke-width: 2; }
    .box-f { fill: #fdf3e6; stroke: #a75d00; stroke-width: 2; }
    .shaft { stroke: #16202c; stroke-width: 6; fill: none; }
    .dc { stroke: #a75d00; stroke-width: 3; fill: none; }
    .wheel { fill: #2b3440; stroke: #16202c; stroke-width: 2; }
    .b { font-size: 15px; font-weight: 600; }
    .lbl { font-size: 13px; fill: #4a5a6b; }
  </style>


  <rect class="box-f" x="20" y="150" width="110" height="60" rx="6"/>
  <text x="75" y="185" text-anchor="middle" class="b">engine</text>
  <path class="shaft" d="M130 180 H440"/>
  <rect class="box" x="150" y="160" width="40" height="40" rx="4"/>
  <text x="170" y="185" text-anchor="middle" class="lbl">K0</text>
  <rect class="box-e" x="220" y="70" width="100" height="60" rx="6"/>
  <text x="270" y="105" text-anchor="middle" class="b">motor</text>
  <path class="shaft" d="M270 130 V180"/>
  <rect class="box" x="340" y="150" width="90" height="60" rx="6"/>
  <text x="385" y="177" text-anchor="middle" class="b">trans-</text>
  <text x="385" y="196" text-anchor="middle" class="b">mission</text>
  <text x="385" y="232" text-anchor="middle" class="lbl">ratio ties the engine</text>
  <text x="385" y="248" text-anchor="middle" class="lbl">speed to the wheels</text>
  <path class="shaft" d="M430 180 H480 V270"/>
  <rect class="wheel" x="445" y="270" width="70" height="30" rx="6"/>
  <text x="480" y="325" text-anchor="middle" class="lbl">wheels</text>
  <rect class="box-e" x="20" y="250" width="110" height="60" rx="6"/>
  <text x="75" y="285" text-anchor="middle" class="b">battery</text>
  <path class="dc" d="M130 280 H210 V100 H220"/>
  <text x="270" y="375" text-anchor="middle" class="lbl">a mechanical path from the engine to the wheels, the motor on the same shaft</text>
</svg>
