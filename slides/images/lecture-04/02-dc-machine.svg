<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" width="1100" height="360">
  <style>
    text { font-family: sans-serif; fill: #16202c; }
    .wire { stroke: #16202c; stroke-width: 2.5; fill: none; }
    .part { fill: #eaf1fa; stroke: #1f5fa8; stroke-width: 2; }
    .loss { fill: #fdf0e0; stroke: #a75d00; stroke-width: 2; }
    .shaft { stroke: #16202c; stroke-width: 7; fill: none; }
    .housing { fill: #d5dbe1; stroke: #4a5a6b; stroke-width: 1.5; }
    .couple { stroke: #1f5fa8; stroke-width: 2; stroke-dasharray: 6 4; fill: none; }
    .frame { fill: none; stroke: #4a5a6b; stroke-width: 1.5; stroke-dasharray: 8 5; }
    .t { font-size: 17px; font-weight: 600; }
    .lbl { font-size: 14px; fill: #4a5a6b; }
    .sig { font-size: 16px; font-weight: 600; }
    .lossl { font-size: 14px; font-weight: 600; fill: #a75d00; }
    .code { font-size: 12px; font-family: monospace; fill: #1f5fa8; }
  </style>
  <defs>
    <marker id="dm-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#16202c"/></marker>
  </defs>

  <rect class="frame" x="70" y="20" width="900" height="300" rx="10"/>
  <text x="84" y="42" class="lbl">DCMachine</text>

  <circle cx="40" cy="90" r="7" fill="#fff" stroke="#16202c" stroke-width="2.5"/>
  <text x="40" y="70" text-anchor="middle" class="sig">p</text>
  <circle cx="40" cy="270" r="7" fill="#fff" stroke="#16202c" stroke-width="2.5"/>
  <text x="40" y="300" text-anchor="middle" class="sig">n</text>
  <path class="wire" d="M48 90 H120"/>
  <path class="wire" d="M120 90 H140 l6 -12 l12 24 l12 -24 l12 24 l12 -24 l12 24 l6 -12 H230"/>
  <text x="185" y="126" text-anchor="middle" class="t">R</text>
  <text x="185" y="146" text-anchor="middle" class="lbl">0.05 Ω</text>
  <text x="185" y="62" text-anchor="middle" class="lossl">copper R i²</text>
  <path class="wire" d="M230 90 H250 a10 10 0 0 1 20 0 a10 10 0 0 1 20 0 a10 10 0 0 1 20 0 a10 10 0 0 1 20 0 H350"/>
  <text x="300" y="126" text-anchor="middle" class="t">L</text>
  <text x="300" y="146" text-anchor="middle" class="lbl">0.5 mH</text>
  <path class="wire" d="M350 90 H400 V140"/>
  <circle class="part" cx="400" cy="180" r="40"/>
  <text x="400" y="186" text-anchor="middle" class="t">E</text>
  <text x="400" y="246" text-anchor="middle" class="lbl">E = KΦ ω</text>
  <text x="400" y="266" text-anchor="middle" class="lbl">T = KΦ i</text>
  <path class="wire" d="M400 220 V230"/>
  <path class="wire" d="M48 270 H120"/>
  <path class="wire" d="M120 270 H330 V220 H400"/>
  <path class="wire" d="M90 96 V130" marker-end="url(#dm-ink)"/>
  <text x="100" y="124" class="sig">i</text>
  <text x="400" y="134" text-anchor="middle" class="code">RotationalEMF</text>

  <path class="couple" d="M440 180 H500"/>
  <text x="470" y="170" text-anchor="middle" class="lbl">KΦ</text>

  <path class="shaft" d="M500 180 H1040"/>
  <rect class="part" x="510" y="140" width="70" height="80" rx="4"/>
  <text x="545" y="186" text-anchor="middle" class="t">J</text>
  <text x="545" y="240" text-anchor="middle" class="lbl">rotor</text>

  <rect class="loss" x="610" y="70" width="80" height="60" rx="4"/>
  <text x="650" y="98" text-anchor="middle" class="t">T_f</text>
  <text x="650" y="118" text-anchor="middle" class="lbl">friction</text>
  <rect class="loss" x="710" y="70" width="80" height="60" rx="4"/>
  <text x="750" y="98" text-anchor="middle" class="t">K_i</text>
  <text x="750" y="118" text-anchor="middle" class="lbl">iron</text>
  <rect class="loss" x="810" y="70" width="80" height="60" rx="4"/>
  <text x="850" y="98" text-anchor="middle" class="t">k_w ω²</text>
  <text x="850" y="118" text-anchor="middle" class="lbl">windage</text>
  <rect class="loss" x="910" y="70" width="80" height="60" rx="4"/>
  <text x="950" y="98" text-anchor="middle" class="t">C / ω</text>
  <text x="950" y="118" text-anchor="middle" class="lbl">constant</text>
  <path class="wire" d="M650 130 V180 M750 130 V180 M850 130 V180 M950 130 V172"/>
  <text x="800" y="58" text-anchor="middle" class="lossl">shaft losses, as braking torques on the housing</text>

  <rect class="housing" x="600" y="250" width="380" height="22" rx="3"/>
  <text x="790" y="296" text-anchor="middle" class="lbl">housing (support)</text>
  <path class="wire" d="M620 180 V250" stroke-dasharray="4 4"/>

  <circle cx="1048" cy="180" r="9" fill="#fff" stroke="#16202c" stroke-width="2.5"/>
  <text x="1048" y="214" text-anchor="middle" class="sig">spline</text>
  <text x="1048" y="234" text-anchor="middle" class="lbl">τ, ω</text>
</svg>
