<!DOCTYPE html>
<meta charset="utf-8">
<title>PlutoDeck</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- An empty data URL is what stops the browser asking for a favicon and logging the 404. -->
<link rel="icon" href="data:,">
<link rel="stylesheet" href="deck.css">

<header>
  <h1 id="deck-title">PlutoDeck</h1>
  <p id="deck-notebook"></p>
  <p>
    <span id="kernel-status">the kernel is starting</span> ·
    <a id="editor-link" href="#">open the notebook in Pluto</a>
  </p>
</header>

<!-- Rendered so its scripts run, never shown: see the preamble comment in deck.js. -->
<div id="preamble" hidden></div>

<main id="slides"></main>

<nav id="deck-nav" aria-label="Slides">
  <button id="previous-slide" type="button" disabled>Previous slide</button>
  <!-- Live, because after a keyboard move the position is the only thing that announces it. -->
  <p id="slide-position" aria-live="polite"></p>
  <button id="next-slide" type="button" disabled>Next slide</button>
  <button id="toggle-cues" type="button" aria-pressed="false">Speaker cues (C)</button>
</nav>

<!-- Over the slide rather than in it: a cue is for the lecturer, and the room is looking at
     the same screen. `hidden` is the whole of the closed state. -->
<aside id="speaker-cues" aria-label="Speaker cues" hidden>
  <div id="cue-body"></div>
</aside>

<script type="module" src="deck.js"></script>
