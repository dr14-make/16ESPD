<!DOCTYPE html>
<meta charset="utf-8">
<title>PlutoDeck</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- An empty data URL is what stops the browser asking for a favicon and logging the 404. -->
<link rel="icon" href="data:,">
<link rel="stylesheet" href="{{deck.css}}">
<!-- Not preloaded: fetched only by a deck that has math to draw. -->
<link rel="mathjax-source" href="{{mathjax.js}}">
<!-- Likewise fetched only by a deck that has a plot to draw. `data-version` is the key a plot
     cell asks for: a deck serving any other version is one whose plots all go to the network. -->
<link rel="plotly-source" href="{{plotly.js}}" data-version="{{plotly.version}}">

<!-- What a plot cell imports off the internet, served from here instead; see `VENDORED_IMPORTS`
     in build.mjs. Ahead of every module script, because a map is read only before the first. -->
<script type="importmap">{{importmap}}</script>

<deck-app></deck-app>

<script type="module" src="{{deck.js}}"></script>
