# The slides/ workspace builds on the Node major the Pages workflow uses.
[tools]
node = "22"

[tasks."cards:lecture-02"]
description = "Export the Lecture 2 notebooks' deck cells into the theory deck's public/cards/"
run = "julia +dyad-3.5.0 --project=. scripts/export_deck_cards.jl"

[tasks."figures:lecture-03"]
description = "Run the Lecture 3 notebooks and write their figures into the theory deck's public/figures/"
run = "julia +dyad-3.5.0 --project=. scripts/export_lecture03_figures.jl"

[tasks."figures:lecture-03-steer"]
description = "Export planar brake-and-steer figures"
run = "julia +dyad-3.5.0 --project=. scripts/export_lecture03_steer_figures.jl"

[tasks."figures:lecture-03-esp"]
description = "Export planar ESP and split-friction figures"
run = "julia +dyad-3.5.0 --project=. scripts/export_lecture03_esp_figures.jl"

[tasks."figures:lecture-04"]
description = "Run the Lecture 4 notebooks and write their figures into the theory deck's public/figures/"
run = "julia +dyad-3.5.0 --project=. scripts/export_lecture04_figures.jl"

[tasks."figures:lecture-03-build"]
description = "Run the Lecture 3 build's reference models and write their figures into slides/images/lecture-03/"
run = "julia +dyad-3.5.0 --project=. scripts/export_lecture03_build_figures.jl"

# The suite resolves snapshots against test/, so both tasks run from there.
[tasks.test]
description = "Run the Julia test suite, each group in its own process, and summarize the groups"
dir = "{{config_root}}/test"
run = "julia +dyad-3.5.0 --project=.. runtests.jl"

[tasks."test:group"]
description = "Run the named test groups in this process, e.g. `mise run test:group esp brake`"
usage = 'arg "<group>" var=#true help="Group names from GROUPS in test/runtests.jl"'
dir = "{{config_root}}/test"
run = "julia +dyad-3.5.0 --project=.. runtests.jl {{ usage.group | join(sep=' ') }}"

[tasks."drive:setup"]
description = "Install the window and controller packages the interactive drive needs"
sources = ["sim/Project.toml"]
outputs = ["sim/Manifest.toml"]
run = "julia +dyad-3.5.0 --project=sim -e 'using Pkg; Pkg.instantiate()'"

[tasks.drive]
description = "Drive the by-hand car in a window, e.g. `mise run drive ice_patch hill`"
usage = '''
arg "[road]" default="" help="Grip file: ice_patch, right_patch, uniform_low, or a path"
arg "[height]" default="" help="Height file: hill, hill_across, ramp, ramp_hold, or a path"
'''
depends = ["drive:setup"]
run = "julia +dyad-3.5.0 --project=. sim/drive.jl '{{ usage.road }}' '{{ usage.height }}'"
